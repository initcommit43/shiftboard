spring:
  application:
    name: shiftboard-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shiftboard}
    username: ${DB_USER:shiftboard}
    password: ${DB_PASSWORD:shiftboard}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
  web:
    resources:
      add-mappings: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

shiftboard:
  jobs:
    # Background jobs; ShedLock lets one instance run each of them at a time.
    enabled: true
    complete-shifts-every: PT1M
  push:
    fcm:
      # Service account key of the Firebase project. Without it, push notifications are only logged (ADR 0024).
      credentials-file: ${FCM_CREDENTIALS_FILE:}
  api:
    # Version of the contract in api/openapi.yaml that this backend implements.
    version: 0.1.0
  security:
    # Signs the access tokens, at least 32 characters. No default: without it the application
    # only starts with the local profile.
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    login-rate-limit:
      # Login attempts per email and client address within the window.
      max-attempts: 5
      window: 15m
