spring:
  application:
    name: shiftboard-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shiftboard}
    username: ${DB_USER:shiftboard}
    password: ${DB_PASSWORD:shiftboard}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
  web:
    resources:
      add-mappings: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

shiftboard:
  api:
    # Version of the contract in api/openapi.yaml that this backend implements.
    version: 0.1.0
