openapi: 3.1.0
info:
  title: shiftboard API
  version: 0.1.0
  summary: Shift distribution platform for staffing agencies.
  description: |
    Single source of truth for the shiftboard API. The Dart client of the worker
    app and the TypeScript client of the agency dashboard are generated from
    this file.

    Conventions:
    - REST under `/api/v1`
    - errors as RFC 9457 problem details (`application/problem+json`) with a
      machine-readable `code` that clients translate
    - page/size pagination for lists, pages start at 0
    - UUID v7 identifiers
    - changes stay backward compatible

    Authentication: `POST /auth/login` returns a short-lived access token and a
    refresh token. The access token is sent as `Authorization: Bearer <token>`.
    Refresh tokens are single use: `POST /auth/refresh` returns a new pair.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8080/api/v1
    description: Local development
tags:
  - name: system
    description: Service status
  - name: signup
    description: Worker self-signup through an agency's signup link
  - name: auth
    description: Login, token refresh, logout and the current user
  - name: workers
    description: The agency's worker pool
  - name: clients
    description: The agency's customers, their locations and the qualifications a shift can ask for
  - name: shifts
    description: Shifts the agency creates and publishes
  - name: shift-templates
    description: Named shift templates the agency starts new shifts from
  - name: assignments
    description: The claims on a shift and the agency's decisions on them
  - name: settings
    description: Workflow settings of the agency
  - name: worker-shifts
    description: What a worker sees of the agency's shifts, claiming a spot, and the shifts they claimed
  - name: messages
    description: The conversation between each worker and the agency, system messages and broadcasts
  - name: notifications
    description: Push notification devices and preferences of a worker
  - name: hours
    description: Check-in and check-out, and the hours the agency approves for payroll
security:
  - bearerAuth: []
paths:
  /ping:
    get:
      operationId: ping
      tags: [system]
      summary: Check that the API is reachable
      description: Returns the service status and API version. Needs no authentication.
      security: []
      responses:
        "200":
          description: The API is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ping"
        default:
          $ref: "#/components/responses/Problem"

  /signup/{signupCode}:
    parameters:
      - $ref: "#/components/parameters/SignupCode"
    get:
      operationId: getSignupInfo
      tags: [signup]
      summary: Look up the agency behind a signup link
      description: |
        Returns what the signup form needs: the agency's name. Needs no
        authentication.

        Error codes: `signup_code_unknown` (404).
      security: []
      responses:
        "200":
          description: The agency the code belongs to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupInfo"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: signUp
      tags: [signup]
      summary: Sign up as a worker of the agency
      description: |
        Creates a user account and a worker profile with status `PENDING` and
        logs the worker in. The agency approves or rejects the signup later.
        Needs no authentication.

        `dateOfBirth` must be a real calendar date in the past. Its field
        error codes are `required`, `invalid_format` (not a date) and
        `out_of_range` (today or later, or more than 120 years ago).

        Error codes: `validation_failed` (400, with `errors`),
        `signup_code_unknown` (404), `email_already_registered` (409).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerSignupRequest"
      responses:
        "201":
          description: The account was created; the worker is logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      description: |
        Workers log in to the worker app, dispatchers and admins to the
        dashboard. The request names the client it comes from; a role on the
        wrong client is rejected.

        Error codes: `validation_failed` (400), `invalid_credentials` (401,
        the same for an unknown email and a wrong password), `wrong_client`
        (403), `too_many_attempts` (429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Exchange a refresh token for a new token pair
      description: |
        The refresh token is single use; the response contains its
        replacement.

        Error codes: `invalid_refresh_token` (401, unknown, expired, revoked or
        already used).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: A new token pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the session on this device
      description: |
        Revokes the given refresh token. Succeeds even if the token is unknown
        or already revoked. Needs no access token, so logging out works after
        the access token has expired.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "204":
          description: The session has ended.
        default:
          $ref: "#/components/responses/Problem"

  /me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: The logged-in user
      description: |
        Returns the account, its agency and, for workers, the worker profile
        with its current status. The worker app calls this on start to decide
        between the shift list, the waiting screen and the inactive screen.
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /workers:
    get:
      operationId: listWorkers
      tags: [workers]
      summary: List the agency's workers
      description: |
        Dispatchers and admins only. Sorted by signup time, oldest first.

        Error codes: `forbidden` (403).
      parameters:
        - name: status
          in: query
          description: Only workers with this status.
          schema:
            $ref: "#/components/schemas/WorkerStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: One page of workers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerPage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /workers/{workerId}/approve:
    parameters:
      - $ref: "#/components/parameters/WorkerId"
    post:
      operationId: approveWorker
      tags: [workers]
      summary: Approve a pending signup
      description: |
        Sets the worker to `ACTIVE`. Dispatchers and admins only.

        Error codes: `forbidden` (403), `worker_not_found` (404),
        `worker_not_pending` (409).
      responses:
        "200":
          description: The approved worker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /workers/{workerId}/reject:
    parameters:
      - $ref: "#/components/parameters/WorkerId"
    post:
      operationId: rejectWorker
      tags: [workers]
      summary: Reject a pending signup
      description: |
        Sets the worker to `INACTIVE`. Dispatchers and admins only.

        Error codes: `forbidden` (403), `worker_not_found` (404),
        `worker_not_pending` (409).
      responses:
        "200":
          description: The rejected worker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List the agency's clients with their locations
      description: |
        What the shift form offers to choose from. Dispatchers and admins
        only. Sorted by name; the locations of a client are sorted by name too.

        Error codes: `forbidden` (403).
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: One page of clients.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientPage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /qualifications:
    get:
      operationId: listQualifications
      tags: [clients]
      summary: List the agency's qualifications
      description: |
        The qualifications a shift can require. Dispatchers and admins only.
        Sorted by name.

        Error codes: `forbidden` (403).
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: One page of qualifications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualificationPage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /agency/settings:
    get:
      operationId: getAgencySettings
      tags: [settings]
      summary: The agency's workflow settings
      description: |
        Dispatchers and admins.

        Error codes: `forbidden` (403).
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgencySettings"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateAgencySettings
      tags: [settings]
      summary: Change the agency's workflow settings
      description: |
        Applies to claims and cancellations made afterwards; decisions already
        made stay as they are. Admins only.

        Field error codes: `required`, `out_of_range`
        (`cancellationDeadlineHours` below 0 or above 336).

        Error codes: `validation_failed` (400, with `errors`), `forbidden`
        (403, not an admin).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgencySettings"
      responses:
        "200":
          description: The changed settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgencySettings"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /agency/features:
    get:
      operationId: getAgencyFeatures
      tags: [settings]
      summary: The optional features the agency has switched on
      description: |
        Dispatchers and admins.

        Error codes: `forbidden` (403).
      responses:
        "200":
          description: The features.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgencyFeatures"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateAgencyFeatures
      tags: [settings]
      summary: Switch optional features on or off
      description: |
        Admins only.

        Field error codes: `required`.

        Error codes: `validation_failed` (400, with `errors`), `forbidden`
        (403, not an admin).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgencyFeatures"
      responses:
        "200":
          description: The changed features.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgencyFeatures"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /conversations:
    get:
      operationId: listConversations
      tags: [messages]
      summary: The agency's shared inbox
      description: |
        Every worker conversation that has a message, the most recent message
        first, with how many of the worker's messages nobody at the agency has
        read yet. Dispatchers and admins only; any of them can answer any
        conversation.

        Error codes: `forbidden` (403).
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: One page of conversations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationPage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /conversations/unread-count:
    get:
      operationId: getInboxUnreadCount
      tags: [messages]
      summary: How many worker messages nobody at the agency has read
      description: |
        For the badge of the inbox. Dispatchers and admins only.

        Error codes: `forbidden` (403).
      responses:
        "200":
          description: The count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /conversations/{conversationId}/messages:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: listConversationMessages
      tags: [messages]
      summary: The messages of one conversation
      description: |
        Newest first; the first page is what a chat shows at the bottom.
        Marks the worker's messages in it as read. Dispatchers and admins only.

        Error codes: `forbidden` (403), `conversation_not_found` (404).
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: One page of messages, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: replyToConversation
      tags: [messages]
      summary: Answer a worker
      description: |
        Sends a text message from the agency to the worker. Dispatchers and
        admins only.

        Field error codes: `required`, `invalid_length` (`body`), `not_found`
        (`shiftId` is not a published, completed or cancelled shift of the
        agency).

        Error codes: `validation_failed` (400, with `errors`), `forbidden`
        (403), `conversation_not_found` (404).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageRequest"
      responses:
        "201":
          description: The sent message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /shifts:
    get:
      operationId: listShifts
      tags: [shifts]
      summary: List the agency's upcoming or past shifts
      description: |
        `UPCOMING` (the default): draft, published and cancelled shifts that
        have not ended yet, sorted by start time, earliest first. `PAST`:
        published, completed and cancelled shifts that have ended, latest
        start first; drafts that were never published are left out.
        Dispatchers and admins only.

        Error codes: `forbidden` (403).
      parameters:
        - name: period
          in: query
          description: Which shifts to list.
          schema:
            $ref: "#/components/schemas/ShiftPeriod"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: One page of shifts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftPage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createShift
      tags: [shifts]
      summary: Create a shift
      description: |
        Creates the shift as `DRAFT`, or as `PUBLISHED` when `publish` is
        true. Dispatchers and admins only.

        Field error codes: `required`, `invalid_format`, `invalid_length`,
        `out_of_range` (`hourlyRateCents` below 1, `slots` below 1 or above
        500), `before_start` (`endsAt` is not after `startsAt`) and
        `not_found` (`clientId` is not a client of the agency, `locationId` is
        not a location of that client, or `qualificationIds` contains an
        unknown qualification).

        Error codes: `validation_failed` (400, with `errors`), `forbidden`
        (403).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftRequest"
      responses:
        "201":
          description: The created shift.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /shifts/{shiftId}:
    parameters:
      - $ref: "#/components/parameters/ShiftId"
    get:
      operationId: getShift
      tags: [shifts]
      summary: One shift of the agency
      description: |
        Any shift of the agency, drafts included. Dispatchers and admins only.

        Error codes: `forbidden` (403), `shift_not_found` (404).
      responses:
        "200":
          description: The shift.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateShift
      tags: [shifts]
      summary: Change a shift
      description: |
        Replaces every field of a draft, or of a published shift that has
        not started yet; its status, spots taken and claims stay. Workers who
        hold a spot get a system message that says what changed, and a push.
        Saving without a change tells nobody. Dispatchers and admins only.

        Field error codes: the same as when creating a shift, plus
        `below_taken` (`slots` is below the spots that confirmed and pending
        claims hold).

        Error codes: `validation_failed` (400, with `errors`), `forbidden`
        (403), `shift_not_found` (404), and with 409: `shift_not_editable`
        (the shift has started, ended, or is cancelled or completed),
        `shift_overlap` (at the new time, a worker who holds a spot would
        overlap another shift they hold) and `concurrent_change` (the shift
        kept changing at the same moment; try again).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftChangeRequest"
      responses:
        "200":
          description: The changed shift.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /shifts/{shiftId}/publish:
    parameters:
      - $ref: "#/components/parameters/ShiftId"
    post:
      operationId: publishShift
      tags: [shifts]
      summary: Publish a draft
      description: |
        Sets the shift to `PUBLISHED`, so that workers can see and claim it.
        Dispatchers and admins only.

        Error codes: `forbidden` (403), `shift_not_found` (404),
        `shift_not_draft` (409).
      responses:
        "200":
          description: The published shift.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /shifts/{shiftId}/cancel:
    parameters:
      - $ref: "#/components/parameters/ShiftId"
    post:
      operationId: cancelShift
      tags: [shifts]
      summary: Call off a shift
      description: |
        Sets a draft or published shift that has not ended to `CANCELLED`,
        together with all its pending and confirmed assignments (`cancelledBy`
        is `AGENCY`).
        Dispatchers and admins only.

        Error codes: `forbidden` (403), `shift_not_found` (404), and with 409:
        `shift_not_cancellable` (the shift has ended or is already
        cancelled) and `concurrent_change` (the shift kept changing at the
        same moment; try again).
      responses:
        "200":
          description: The cancelled shift.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /shifts/{shiftId}/broadcast:
    parameters:
      - $ref: "#/components/parameters/ShiftId"
    post:
      operationId: broadcastToShift
      tags: [messages]
      summary: Message all confirmed workers of a shift
      description: |
        Puts the message into the conversation of every worker whose
        assignment on the shift is `CONFIRMED`, tagged with the shift and
        typed `BROADCAST`. Others do not get it. Dispatchers and admins only.

        Field error codes: `required`, `invalid_length` (`body`).

        Error codes: `validation_failed` (400, with `errors`), `forbidden`
        (403), `shift_not_found` (404), `no_recipients` (409, nobody is
        confirmed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BroadcastRequest"
      responses:
        "201":
          description: How many workers got the message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /shifts/{shiftId}/assignments:
    parameters:
      - $ref: "#/components/parameters/ShiftId"
    get:
      operationId: listShiftAssignments
      tags: [assignments]
      summary: List the claims on a shift
      description: |
        The assignments of the shift, sorted by claim time, oldest first.
        Dispatchers and admins only.

        Error codes: `forbidden` (403), `shift_not_found` (404).
      parameters:
        - name: status
          in: query
          description: Only assignments with this status.
          schema:
            $ref: "#/components/schemas/AssignmentStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: One page of assignments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftAssignmentPage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /shifts/{shiftId}/assignments/{assignmentId}/approve:
    parameters:
      - $ref: "#/components/parameters/ShiftId"
      - $ref: "#/components/parameters/AssignmentId"
    post:
      operationId: approveAssignment
      tags: [assignments]
      summary: Approve a claim
      description: |
        Sets a pending assignment to `CONFIRMED`. Dispatchers and admins only.

        Error codes: `forbidden` (403), `shift_not_found` (404),
        `assignment_not_found` (404), `assignment_not_pending` (409).
      responses:
        "200":
          description: The assignment after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftAssignment"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /shifts/{shiftId}/assignments/{assignmentId}/reject:
    parameters:
      - $ref: "#/components/parameters/ShiftId"
      - $ref: "#/components/parameters/AssignmentId"
    post:
      operationId: rejectAssignment
      tags: [assignments]
      summary: Reject a claim
      description: |
        Sets a pending assignment to `REJECTED` and frees its spot. Dispatchers
        and admins only.

        Error codes: `forbidden` (403), `shift_not_found` (404),
        `assignment_not_found` (404), and with 409: `assignment_not_pending`
        and `concurrent_change` (the shift kept changing at the same moment;
        try again).
      responses:
        "200":
          description: The assignment after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftAssignment"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /shifts/{shiftId}/assignments/{assignmentId}/remove:
    parameters:
      - $ref: "#/components/parameters/ShiftId"
      - $ref: "#/components/parameters/AssignmentId"
    post:
      operationId: removeAssignment
      tags: [assignments]
      summary: Remove a worker from a shift
      description: |
        Sets a pending or confirmed assignment to `CANCELLED` with
        `cancelledBy` `AGENCY` and frees its spot. The reason is kept for the
        agency; the worker does not see it. Dispatchers and admins only.

        Field error codes: `required`, `invalid_length` (`reason`).

        Error codes: `validation_failed` (400, with `errors`), `forbidden`
        (403), `shift_not_found` (404), `assignment_not_found` (404), and with
        409: `assignment_not_active` (not pending or confirmed) and
        `concurrent_change` (the shift kept changing at the same moment; try
        again).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveAssignmentRequest"
      responses:
        "200":
          description: The assignment after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftAssignment"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /shifts/{shiftId}/assignments/{assignmentId}/no-show:
    parameters:
      - $ref: "#/components/parameters/ShiftId"
      - $ref: "#/components/parameters/AssignmentId"
    post:
      operationId: markNoShow
      tags: [assignments]
      summary: Mark a worker as not turned up
      description: |
        Sets a completed assignment to `NO_SHOW`. Dispatchers and admins only.

        Error codes: `forbidden` (403), `shift_not_found` (404),
        `assignment_not_found` (404), and with 409:
        `assignment_not_completed` and `worker_attended` (the worker checked
        in or has approved hours).
      responses:
        "200":
          description: The assignment after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftAssignment"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /shifts/{shiftId}/assignments/{assignmentId}/hours:
    parameters:
      - $ref: "#/components/parameters/ShiftId"
      - $ref: "#/components/parameters/AssignmentId"
    put:
      operationId: approveHours
      tags: [hours]
      summary: Approve the hours a worker worked
      description: |
        Saves start, end and break of a worker who held a confirmed spot on a
        shift that has started, and approves them for payroll. The hours can
        be saved again; the latest save counts. Dispatchers and admins only.

        Field error codes: `required`, `before_start` (`endedAt` is not
        after `startedAt`), `too_long` (`endedAt` is more than 24 hours after
        `startedAt`, or `breakMinutes` is not shorter than the time between
        them), `out_of_range`.

        Error codes: `validation_failed` (400, with `errors`), `forbidden`
        (403), `shift_not_found` (404), `assignment_not_found` (404), and
        with 409: `shift_not_started` and `assignment_not_worked` (the
        assignment is not confirmed or completed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HoursRequest"
      responses:
        "200":
          description: The assignment with its approved hours.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftAssignment"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /hours:
    get:
      operationId: listHours
      tags: [hours]
      summary: List the hours of a period
      description: |
        One entry per worker who held a confirmed spot on a shift that has
        started, for shifts starting in `[from, to)`, sorted by shift start,
        then by the worker's last name. An entry is `OPEN` until the agency
        approved its hours. Feeds the payroll export, which the dashboard
        builds. Dispatchers and admins only.

        Error codes: `validation_failed` (400, `to` is not after `from`),
        `forbidden` (403).
      parameters:
        - name: from
          in: query
          required: true
          description: Shifts starting at or after this time.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: Shifts starting before this time.
          schema:
            type: string
            format: date-time
        - name: status
          in: query
          description: Only entries with this status.
          schema:
            $ref: "#/components/schemas/HoursStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: One page of entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HoursEntryPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /shift-templates:
    get:
      operationId: listShiftTemplates
      tags: [shift-templates]
      summary: List the agency's shift templates
      description: |
        Every template of the agency, sorted by name. Templates are shared:
        every dispatcher and admin sees all of them. Dispatchers and admins
        only.

        Error codes: `forbidden` (403).
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: One page of templates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftTemplatePage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createShiftTemplate
      tags: [shift-templates]
      summary: Save a shift template
      description: |
        Saves everything a new shift needs except its date. Dispatchers and
        admins only.

        Field error codes: `required`, `invalid_format` (`startTime` is not
        `hh:mm`), `invalid_length`, `out_of_range` (`hourlyRateCents` below 1,
        `slots` below 1 or above 500, `durationMinutes` below 1 or above 1439)
        and `not_found` (`clientId` is not a client of the agency,
        `locationId` is not a location of that client, or `qualificationIds`
        contains an unknown qualification).

        Error codes: `validation_failed` (400, with `errors`), `forbidden`
        (403), `template_name_taken` (409, the agency has a template with
        this name already, ignoring case).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftTemplateRequest"
      responses:
        "201":
          description: The saved template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftTemplate"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /shift-templates/{templateId}:
    parameters:
      - $ref: "#/components/parameters/TemplateId"
    put:
      operationId: updateShiftTemplate
      tags: [shift-templates]
      summary: Change a shift template
      description: |
        Replaces every field of the template, its name included. Shifts
        already created from it do not change. Dispatchers and admins only.

        Field error codes: the same as when saving a template.

        Error codes: `validation_failed` (400, with `errors`), `forbidden`
        (403), `template_not_found` (404), `template_name_taken` (409,
        another template of the agency has this name, ignoring case).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftTemplateRequest"
      responses:
        "200":
          description: The changed template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftTemplate"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteShiftTemplate
      tags: [shift-templates]
      summary: Delete a shift template
      description: |
        Shifts already created from the template do not change.
        Dispatchers and admins only.

        Error codes: `forbidden` (403), `template_not_found` (404).
      responses:
        "204":
          description: The template is gone.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /worker/shifts:
    get:
      operationId: listWorkerShifts
      tags: [worker-shifts]
      summary: List the shifts a worker can claim
      description: |
        The agency's published shifts that have not started yet, sorted by
        start time, earliest first. Full shifts are included, so that the app
        can show them as full. A shift the worker has claimed carries their
        `assignment`. Active workers only.

        Qualifications are not matched: every active worker sees every
        published shift, and `qualifications` is information for the worker.

        Error codes: `forbidden` (403, not a worker), `worker_not_active`
        (403, the signup is pending or the worker is inactive).
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: One page of shifts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerShiftPage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /worker/shifts/{shiftId}:
    parameters:
      - $ref: "#/components/parameters/ShiftId"
    get:
      operationId: getWorkerShift
      tags: [worker-shifts]
      summary: One shift as a worker sees it
      description: |
        A published, completed or cancelled shift of the agency, whether or
        not it has started, so that the detail of a claimed shift stays
        reachable. A draft does not exist for workers. Active workers only.

        Error codes: `forbidden` (403), `worker_not_active` (403),
        `shift_not_found` (404).
      responses:
        "200":
          description: The shift.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerShift"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /worker/shifts/{shiftId}/claim:
    parameters:
      - $ref: "#/components/parameters/ShiftId"
    post:
      operationId: claimShift
      tags: [worker-shifts]
      summary: Claim a spot on a shift
      description: |
        Creates the worker's assignment as `PENDING` and counts the spot as
        taken. When two workers claim the last spot at the same time, one of
        them gets `shift_full`. The claim is not checked against the shift's
        qualifications. Active workers only.

        Error codes: `forbidden` (403), `worker_not_active` (403),
        `shift_not_found` (404), and with 409: `shift_full` (no spot left),
        `shift_already_claimed` (the worker has claimed this shift before,
        whatever became of that claim), `shift_started` (the start time has
        passed), `shift_not_open` (cancelled or completed) and
        `shift_overlap` (it overlaps one of the worker's pending or confirmed
        shifts).
      responses:
        "201":
          description: The shift with the worker's new assignment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerShift"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /worker/shifts/{shiftId}/cancel:
    parameters:
      - $ref: "#/components/parameters/ShiftId"
    post:
      operationId: cancelClaim
      tags: [worker-shifts]
      summary: Drop out of a claimed shift
      description: |
        Sets the worker's pending or confirmed assignment to `CANCELLED` with
        `cancelledBy` `WORKER` and frees the spot. Possible until
        `assignment.cancellableUntil`, which follows from the agency's
        cancellation deadline; afterwards the worker has to contact the
        agency. Active workers only.

        Error codes: `forbidden` (403), `worker_not_active` (403),
        `shift_not_found` (404), `assignment_not_found` (404, the worker has
        not claimed the shift), and with 409: `assignment_not_active` (not
        pending or confirmed), `cancellation_deadline_passed` and
        `concurrent_change` (the shift kept changing at the same moment; try
        again).
      responses:
        "200":
          description: The shift with the worker's cancelled assignment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerShift"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /worker/shifts/{shiftId}/check-in:
    parameters:
      - $ref: "#/components/parameters/ShiftId"
    post:
      operationId: checkIn
      tags: [hours]
      summary: Check in on arrival
      description: |
        Records the time the worker arrived. Possible once, with a confirmed
        spot, from `assignment.checkInFrom` until the shift's end, when the
        agency uses check-in. No location is stored. Active workers only.

        Error codes: `forbidden` (403), `worker_not_active` (403),
        `shift_not_found` (404), `assignment_not_found` (404, the worker has
        not claimed the shift), and with 409: `check_in_disabled` (the agency
        does not use check-in), `assignment_not_confirmed`,
        `check_in_not_open` (too early or after the end) and
        `already_checked_in`.
      responses:
        "200":
          description: The shift with the worker's assignment and its check-in time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerShift"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /worker/shifts/{shiftId}/check-out:
    parameters:
      - $ref: "#/components/parameters/ShiftId"
    post:
      operationId: checkOut
      tags: [hours]
      summary: Check out when leaving
      description: |
        Records the time the worker left. Possible once after checking in,
        also after the planned end, until the agency approved the hours.
        Active workers only.

        Error codes: `forbidden` (403), `worker_not_active` (403),
        `shift_not_found` (404), `assignment_not_found` (404), and with 409:
        `check_in_disabled`, `not_checked_in`, `already_checked_out` and
        `hours_approved`.
      responses:
        "200":
          description: The shift with the worker's assignment and its check-out time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerShift"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /worker/my-shifts:
    get:
      operationId: listMyShifts
      tags: [worker-shifts]
      summary: List the shifts the worker has claimed
      description: |
        Every shift the worker has an assignment for, whatever its status,
        sorted by start time, earliest first. Each shift carries the
        `assignment`. Active workers only.

        Error codes: `forbidden` (403), `worker_not_active` (403).
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: One page of claimed shifts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerShiftPage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /worker/conversation:
    get:
      operationId: getMyConversation
      tags: [messages]
      summary: The worker's conversation with the agency
      description: |
        How many messages from the agency the worker has not read yet. There is
        one conversation per worker; before the first message it is empty.
        Active workers only.

        Error codes: `forbidden` (403), `worker_not_active` (403).
      responses:
        "200":
          description: The count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /worker/conversation/messages:
    get:
      operationId: listMyMessages
      tags: [messages]
      summary: The messages of the worker's conversation
      description: |
        Newest first. Marks the agency's messages, system messages and
        broadcasts in it as read. Active workers only.

        Error codes: `forbidden` (403), `worker_not_active` (403).
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: One page of messages, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Write to the agency
      description: |
        Sends a text message, optionally about a shift (`shiftId`), for
        example when started from the shift's detail. Active workers only.

        Field error codes: `required`, `invalid_length` (`body`), `not_found`
        (`shiftId` is not a shift the worker can see).

        Error codes: `validation_failed` (400, with `errors`), `forbidden`
        (403), `worker_not_active` (403).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageRequest"
      responses:
        "201":
          description: The sent message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /worker/push-tokens:
    post:
      operationId: registerPushToken
      tags: [notifications]
      summary: Register this device for push notifications
      description: |
        Stores the device's Firebase Cloud Messaging token for the worker.
        Registering a token again is harmless; a token that belonged to
        another account moves to this one. Workers only, also while pending.

        Field error codes: `required`, `invalid_length` (`token`).

        Error codes: `validation_failed` (400, with `errors`), `forbidden`
        (403).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenRequest"
      responses:
        "204":
          description: The token is registered.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /worker/push-tokens/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 4096
    delete:
      operationId: unregisterPushToken
      tags: [notifications]
      summary: Stop push notifications to this device
      description: |
        For logging out. Unknown tokens are ignored. Workers only.

        Error codes: `forbidden` (403).
      responses:
        "204":
          description: The device gets no more push notifications.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /worker/notification-settings:
    get:
      operationId: getNotificationSettings
      tags: [notifications]
      summary: The worker's notification preferences
      description: |
        Active workers only.

        Error codes: `forbidden` (403), `worker_not_active` (403).
      responses:
        "200":
          description: The preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateNotificationSettings
      tags: [notifications]
      summary: Pause or resume new-shift notifications
      description: |
        While `newShiftsPaused` is true, the worker gets no push for new
        shifts; claim decisions, cancellations and messages still reach them.
        Active workers only.

        Field error codes: `required`.

        Error codes: `validation_failed` (400, with `errors`), `forbidden`
        (403), `worker_not_active` (403).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationSettings"
      responses:
        "200":
          description: The changed preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SignupCode:
      name: signupCode
      in: path
      required: true
      description: The code from the agency's signup link.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    WorkerId:
      name: workerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ShiftId:
      name: shiftId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TemplateId:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: Page number, starting at 0.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Page size.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Problem:
      description: An error, described as RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Ping:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          description: Always `ok` when the API answers.
          examples: [ok]
        version:
          type: string
          description: Version of the API contract the backend implements.
          examples: ["0.1.0"]

    SignupInfo:
      type: object
      required: [agencyName]
      properties:
        agencyName:
          type: string
          examples: [Donau Personal]

    Qualification:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: [Service]

    WorkerSignupRequest:
      type: object
      required: [firstName, lastName, dateOfBirth, email, phone, password]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        dateOfBirth:
          type: string
          format: date
          examples: ["1998-04-17"]
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          minLength: 5
          maxLength: 30
          examples: ["+43 660 5550101"]
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128

    ClientType:
      type: string
      description: The client a login comes from.
      enum: [WORKER_APP, DASHBOARD]

    LoginRequest:
      type: object
      required: [email, password, client]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
        client:
          $ref: "#/components/schemas/ClientType"

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1

    TokenResponse:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken:
          type: string
          description: JWT, sent as bearer token.
        refreshToken:
          type: string
          description: Opaque, single-use token for `POST /auth/refresh`.
        expiresIn:
          type: integer
          format: int32
          description: Lifetime of the access token in seconds.

    Role:
      type: string
      enum: [ADMIN, DISPATCHER, WORKER]

    WorkerStatus:
      type: string
      description: |
        `PENDING` after signup, `ACTIVE` once the agency approved, `INACTIVE`
        after a rejection or deactivation.
      enum: [PENDING, ACTIVE, INACTIVE]

    AgencySummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        features:
          description: The optional features the agency has switched on.
          $ref: "#/components/schemas/AgencyFeatures"

    AgencyFeatures:
      type: object
      required: [contactButton]
      properties:
        contactButton:
          type: boolean
          description: |
            Workers see a WhatsApp button for the contact person on a shift,
            for agencies that prefer that over the in-app chat. Off by default.
        checkIn:
          type: boolean
          description: |
            Workers check in and out of their shifts in the app. Off by
            default. Always present in responses; absent in a request, it
            stays as it is.

    WorkerProfile:
      type: object
      required: [id, firstName, lastName, status]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        status:
          $ref: "#/components/schemas/WorkerStatus"

    CurrentUser:
      type: object
      required: [id, email, role, agency]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        agency:
          $ref: "#/components/schemas/AgencySummary"
        worker:
          description: Present when the role is `WORKER`.
          $ref: "#/components/schemas/WorkerProfile"

    Worker:
      type: object
      required: [id, firstName, lastName, dateOfBirth, email, phone, status, qualifications, createdAt]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
          format: date
        email:
          type: string
          format: email
        phone:
          type: string
        status:
          $ref: "#/components/schemas/WorkerStatus"
        qualifications:
          type: array
          items:
            $ref: "#/components/schemas/Qualification"
        createdAt:
          type: string
          format: date-time
          description: When the worker signed up.

    WorkerPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Worker"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    QualificationPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Qualification"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    Location:
      type: object
      description: A site of a client where shifts take place.
      required: [id, name, address]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: [Zentrallager Linz]
        address:
          type: string
          description: Postal address in one line.
          examples: ["Industriezeile 40, 4020 Linz"]

    ClientSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: [Nordlicht Logistik]

    Client:
      type: object
      description: A customer of the agency, with the locations shifts can take place at.
      required: [id, name, locations]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: [Nordlicht Logistik]
        locations:
          type: array
          items:
            $ref: "#/components/schemas/Location"

    ClientPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Client"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    ShiftStatus:
      type: string
      description: |
        `DRAFT` until the agency publishes it, `PUBLISHED` while workers can
        see it, `COMPLETED` after it took place, `CANCELLED` when the agency
        called it off. Whether a published shift is full follows from
        `takenSlots` and `slots`.
      enum: [DRAFT, PUBLISHED, COMPLETED, CANCELLED]

    ShiftPeriod:
      type: string
      description: |
        `UPCOMING`: shifts that have not ended yet. `PAST`: shifts that have
        ended.
      enum: [UPCOMING, PAST]
      default: UPCOMING

    ShiftRequest:
      type: object
      required: [clientId, locationId, title, startsAt, endsAt, hourlyRateCents, slots]
      properties:
        clientId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
          description: A location of the client.
        title:
          type: string
          minLength: 1
          maxLength: 120
          examples: [Lagerunterstützung]
        description:
          type: string
          maxLength: 2000
          description: What to bring, the meeting point and anything else workers need to know.
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
          description: Must be after `startsAt`.
        endIsEstimate:
          type: boolean
          default: false
          description: The end is approximate; clients show it with "ca.".
        hourlyRateCents:
          type: integer
          format: int32
          minimum: 1
          description: Gross pay per hour in euro cents.
          examples: [1650]
        slots:
          type: integer
          format: int32
          minimum: 1
          maximum: 500
          description: How many workers the shift needs.
        qualificationIds:
          type: array
          description: |
            Qualifications the shift asks for. Workers see them on the shift;
            a claim is not checked against them. Empty or absent means none.
          uniqueItems: true
          items:
            type: string
            format: uuid
        publish:
          type: boolean
          default: false
          description: Publish the shift right away instead of saving it as a draft.

    ShiftChangeRequest:
      type: object
      description: Every field of a shift, as when creating one; the status does not change.
      required: [clientId, locationId, title, startsAt, endsAt, hourlyRateCents, slots]
      properties:
        clientId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
          description: A location of the client.
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
          description: Absent or empty removes the description.
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
          description: Must be after `startsAt`.
        endIsEstimate:
          type: boolean
          default: false
        hourlyRateCents:
          type: integer
          format: int32
          minimum: 1
          description: Gross pay per hour in euro cents.
        slots:
          type: integer
          format: int32
          minimum: 1
          maximum: 500
          description: Not below the spots taken.
        qualificationIds:
          type: array
          description: Empty or absent means none.
          uniqueItems: true
          items:
            type: string
            format: uuid

    Shift:
      type: object
      required:
        - id
        - title
        - status
        - client
        - location
        - startsAt
        - endsAt
        - endIsEstimate
        - hourlyRateCents
        - slots
        - takenSlots
        - qualifications
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/ShiftStatus"
        client:
          $ref: "#/components/schemas/ClientSummary"
        location:
          $ref: "#/components/schemas/Location"
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        endIsEstimate:
          type: boolean
        hourlyRateCents:
          type: integer
          format: int32
          description: Gross pay per hour in euro cents.
        slots:
          type: integer
          format: int32
          description: How many workers the shift needs.
        takenSlots:
          type: integer
          format: int32
          description: How many of the slots are claimed.
        qualifications:
          type: array
          description: Qualifications the shift asks for. Information only; a claim is not checked against them.
          items:
            $ref: "#/components/schemas/Qualification"
        createdAt:
          type: string
          format: date-time

    ShiftPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Shift"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    ShiftTemplateRequest:
      type: object
      required: [name, clientId, locationId, title, startTime, durationMinutes, hourlyRateCents, slots]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Unique within the agency, ignoring case.
          examples: [Lager Frühschicht]
        clientId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
          description: A location of the client.
        title:
          type: string
          minLength: 1
          maxLength: 120
          examples: [Lagerunterstützung]
        description:
          type: string
          maxLength: 2000
        startTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: |
            Local time of day the shift starts, `hh:mm`. Clients turn it into
            a point in time on the date the dispatcher picks.
          examples: ["07:00"]
        durationMinutes:
          type: integer
          format: int32
          minimum: 1
          maximum: 1439
          description: How long the shift runs. A shift that runs past midnight ends on the next day.
          examples: [480]
        endIsEstimate:
          type: boolean
          default: false
        hourlyRateCents:
          type: integer
          format: int32
          minimum: 1
          description: Gross pay per hour in euro cents.
        slots:
          type: integer
          format: int32
          minimum: 1
          maximum: 500
        qualificationIds:
          type: array
          description: Empty or absent means none.
          uniqueItems: true
          items:
            type: string
            format: uuid

    ShiftTemplate:
      type: object
      description: |
        A shift without a date. Client, location and qualifications are ids;
        one that no longer exists is left out of the form a template fills in.
      required:
        - id
        - name
        - clientId
        - locationId
        - title
        - startTime
        - durationMinutes
        - endIsEstimate
        - hourlyRateCents
        - slots
        - qualificationIds
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        clientId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        startTime:
          type: string
          description: Local time of day, `hh:mm`.
          examples: ["07:00"]
        durationMinutes:
          type: integer
          format: int32
        endIsEstimate:
          type: boolean
        hourlyRateCents:
          type: integer
          format: int32
          description: Gross pay per hour in euro cents.
        slots:
          type: integer
          format: int32
        qualificationIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        createdAt:
          type: string
          format: date-time

    ShiftTemplatePage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ShiftTemplate"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    AssignmentStatus:
      type: string
      description: |
        `PENDING` after the claim, `CONFIRMED` once the agency approved,
        `REJECTED` when it declined, `CANCELLED` when the worker dropped out,
        the agency removed them or the shift was called off, `COMPLETED` after
        the shift took place, `NO_SHOW` when the worker did not turn up.
        Pending and confirmed assignments hold a spot.
      enum: [PENDING, CONFIRMED, REJECTED, CANCELLED, COMPLETED, NO_SHOW]

    CancelledBy:
      type: string
      description: |
        Who cancelled an assignment: `WORKER` when they dropped out, `AGENCY`
        when the agency removed them or called off the shift.
      enum: [WORKER, AGENCY]

    AssignmentSummary:
      type: object
      description: A worker's claim on a shift.
      required: [id, status, claimedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/AssignmentStatus"
        claimedAt:
          type: string
          format: date-time
        cancellableUntil:
          type: string
          format: date-time
          description: |
            Until when the worker can drop out in the app. Present while the
            assignment is pending or confirmed; may already be in the past.
        cancelledBy:
          description: Present when the status is `CANCELLED`.
          $ref: "#/components/schemas/CancelledBy"
        checkInFrom:
          type: string
          format: date-time
          description: |
            From when the worker can check in; possible until the shift's end.
            Present when the agency uses check-in and the assignment is
            confirmed or completed; clients show check-in and check-out only
            then.
        checkedInAt:
          type: string
          format: date-time
          description: When the worker checked in.
        checkedOutAt:
          type: string
          format: date-time
          description: When the worker checked out.
        hoursApproved:
          type: boolean
          description: The agency approved the hours; checking out is no longer possible.

    AssignedWorker:
      type: object
      description: The worker behind a claim, as the agency sees them.
      required: [id, firstName, lastName, phone]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
          examples: ["+43 660 5550101"]

    ShiftAssignment:
      type: object
      description: A claim on a shift as the agency sees it.
      required: [id, status, worker, claimedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/AssignmentStatus"
        worker:
          $ref: "#/components/schemas/AssignedWorker"
        claimedAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
          description: When the claim was last decided on, cancelled or completed. Absent while pending.
        cancelledBy:
          description: Present when the status is `CANCELLED`.
          $ref: "#/components/schemas/CancelledBy"
        reason:
          type: string
          description: Why the agency removed the worker. Present only for a removal.
        checkedInAt:
          type: string
          format: date-time
          description: When the worker checked in in the app.
        checkedOutAt:
          type: string
          format: date-time
          description: When the worker checked out in the app.
        hours:
          description: The approved hours. Absent until the agency approved them.
          $ref: "#/components/schemas/WorkedHours"

    ShiftAssignmentPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ShiftAssignment"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    RemoveAssignmentRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          examples: [Kann laut Rücksprache nicht kommen]

    HoursRequest:
      type: object
      description: The hours a worker worked, as the agency approves them.
      required: [startedAt, endedAt, breakMinutes]
      properties:
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          description: After `startedAt`, at most 24 hours later.
        breakMinutes:
          type: integer
          format: int32
          minimum: 0
          maximum: 1440
          description: Unpaid break. Shorter than the time between start and end.

    WorkedHours:
      type: object
      description: Approved hours of one worker on one shift.
      required: [startedAt, endedAt, breakMinutes, workedMinutes, grossCents, approvedAt]
      properties:
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        breakMinutes:
          type: integer
          format: int32
        workedMinutes:
          type: integer
          format: int32
          description: End minus start minus break, in whole minutes. Not rounded.
        grossCents:
          type: integer
          format: int64
          description: Worked minutes times the shift's hourly rate, in euro cents, rounded half up.
        approvedAt:
          type: string
          format: date-time
          description: When the hours were last saved.

    HoursStatus:
      type: string
      description: "`OPEN` until the agency approved the hours, then `APPROVED`."
      enum: [OPEN, APPROVED]

    HoursShift:
      type: object
      description: The shift of an hours entry.
      required: [id, title, startsAt, endsAt, hourlyRateCents, client, location]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        hourlyRateCents:
          type: integer
          format: int32
        client:
          $ref: "#/components/schemas/ClientSummary"
        location:
          $ref: "#/components/schemas/Location"

    HoursEntry:
      type: object
      description: The hours of one worker on one shift.
      required: [assignmentId, status, shift, worker]
      properties:
        assignmentId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/HoursStatus"
        shift:
          $ref: "#/components/schemas/HoursShift"
        worker:
          $ref: "#/components/schemas/AssignedWorker"
        checkedInAt:
          type: string
          format: date-time
        checkedOutAt:
          type: string
          format: date-time
        hours:
          description: Present when the status is `APPROVED`.
          $ref: "#/components/schemas/WorkedHours"

    HoursEntryPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/HoursEntry"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    AgencySettings:
      type: object
      required: [autoConfirm, cancellationDeadlineHours]
      properties:
        autoConfirm:
          type: boolean
          description: Claims are confirmed right away instead of waiting for the agency. Off by default.
        cancellationDeadlineHours:
          type: integer
          format: int32
          minimum: 0
          maximum: 336
          description: |
            How many hours before the start a worker can still drop out in the
            app. 24 by default; 0 means until the start.
          examples: [24]

    ShiftContact:
      type: object
      description: The person at the agency to ask about a shift; the dispatcher who created it.
      required: [name]
      properties:
        name:
          type: string
          examples: [Anna Berger]
        phone:
          type: string
          description: Absent when the contact has no phone number on record.
          examples: ["+43 660 5550100"]

    WorkerShift:
      type: object
      description: A shift as a worker sees it.
      required:
        - id
        - title
        - status
        - client
        - location
        - startsAt
        - endsAt
        - endIsEstimate
        - hourlyRateCents
        - slots
        - takenSlots
        - qualifications
        - contact
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          description: What to bring, the meeting point and anything else workers need to know.
        status:
          description: Never `DRAFT`.
          $ref: "#/components/schemas/ShiftStatus"
        client:
          $ref: "#/components/schemas/ClientSummary"
        location:
          $ref: "#/components/schemas/Location"
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        endIsEstimate:
          type: boolean
          description: The end is approximate; clients show it with "ca.".
        hourlyRateCents:
          type: integer
          format: int32
          description: Gross pay per hour in euro cents.
        slots:
          type: integer
          format: int32
          description: How many workers the shift needs.
        takenSlots:
          type: integer
          format: int32
          description: How many of the slots are claimed. The shift is full when it equals `slots`.
        qualifications:
          type: array
          description: Qualifications the shift asks for. Information only; a claim is not checked against them.
          items:
            $ref: "#/components/schemas/Qualification"
        contact:
          $ref: "#/components/schemas/ShiftContact"
        assignment:
          description: The worker's own claim on this shift. Absent when they have not claimed it.
          $ref: "#/components/schemas/AssignmentSummary"

    WorkerShiftPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/WorkerShift"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    UnreadCount:
      type: object
      required: [unreadCount]
      properties:
        unreadCount:
          type: integer
          format: int32
          minimum: 0

    MessageType:
      type: string
      description: |
        `TEXT` from the worker or the agency, `SYSTEM` written by the platform
        when a claim or shift changed, `BROADCAST` sent by the agency to all
        confirmed workers of a shift.
      enum: [TEXT, SYSTEM, BROADCAST]

    SystemEvent:
      type: string
      description: |
        What a `SYSTEM` message reports, so that clients can word it in their
        language. `body` carries a German text as a fallback.
      enum: [CLAIM_CONFIRMED, CLAIM_REJECTED, CLAIM_CANCELLED_BY_WORKER, REMOVED_BY_AGENCY, SHIFT_CANCELLED]

    MessageShift:
      type: object
      description: The shift a message is about.
      required: [id, title, startsAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        startsAt:
          type: string
          format: date-time

    Message:
      type: object
      required: [id, type, body, fromWorker, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/MessageType"
        event:
          description: |
            Present for `SYSTEM` messages that clients word themselves. A
            change of the shift has none: its `body` says what changed.
          $ref: "#/components/schemas/SystemEvent"
        body:
          type: string
        fromWorker:
          type: boolean
          description: Written by the worker; otherwise by the agency or the platform.
        senderName:
          type: string
          description: The dispatcher who wrote a `TEXT` or `BROADCAST` message. Absent for the worker's own and for `SYSTEM` messages.
          examples: [Anna Berger]
        shift:
          $ref: "#/components/schemas/MessageShift"
        createdAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
          description: When the other side read it. Absent while unread.

    MessagePage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    MessageRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
        shiftId:
          type: string
          format: uuid
          description: The shift the message is about.

    BroadcastRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
          examples: [Bitte Sicherheitsschuhe mitbringen, Treffpunkt ist heute Tor 5.]

    BroadcastResult:
      type: object
      required: [recipients]
      properties:
        recipients:
          type: integer
          format: int32
          description: How many confirmed workers got the message.

    ConversationWorker:
      type: object
      required: [id, firstName, lastName]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string

    Conversation:
      type: object
      required: [id, worker, lastMessage, unreadCount]
      properties:
        id:
          type: string
          format: uuid
        worker:
          $ref: "#/components/schemas/ConversationWorker"
        lastMessage:
          $ref: "#/components/schemas/Message"
        unreadCount:
          type: integer
          format: int32
          description: Messages of the worker nobody at the agency has read yet.

    ConversationPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    PushPlatform:
      type: string
      enum: [ANDROID, IOS]

    PushTokenRequest:
      type: object
      required: [token, platform]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 4096
          description: The Firebase Cloud Messaging registration token of the device.
        platform:
          $ref: "#/components/schemas/PushPlatform"

    NotificationSettings:
      type: object
      required: [newShiftsPaused]
      properties:
        newShiftsPaused:
          type: boolean
          description: No push for new shifts while true.

    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          description: Name of the request field.
          examples: [email]
        code:
          type: string
          description: Machine-readable reason.
          examples: [invalid_format]

    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: URI reference that identifies the problem type.
          default: about:blank
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          format: int32
          description: HTTP status code.
          minimum: 100
          maximum: 599
        detail:
          type: string
          description: Human-readable explanation of this occurrence.
        instance:
          type: string
          format: uri-reference
          description: URI reference that identifies this occurrence.
        code:
          type: string
          description: Machine-readable error code. Clients translate it into a localized message.
          examples: [email_already_registered]
        errors:
          type: array
          description: Field errors, present when `code` is `validation_failed`.
          items:
            $ref: "#/components/schemas/FieldError"
