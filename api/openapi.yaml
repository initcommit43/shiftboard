openapi: 3.1.0
info:
  title: shiftboard API
  version: 0.1.0
  summary: Shift distribution platform for staffing agencies.
  description: |
    Single source of truth for the shiftboard API. The Dart client of the worker
    app and the TypeScript client of the agency dashboard are generated from
    this file.

    Conventions:
    - REST under `/api/v1`
    - errors as RFC 9457 problem details (`application/problem+json`) with a
      machine-readable `code` that clients translate
    - page/size pagination for lists, pages start at 0
    - UUID v7 identifiers
    - changes stay backward compatible

    Authentication: `POST /auth/login` returns a short-lived access token and a
    refresh token. The access token is sent as `Authorization: Bearer <token>`.
    Refresh tokens are single use: `POST /auth/refresh` returns a new pair.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8080/api/v1
    description: Local development
tags:
  - name: system
    description: Service status
  - name: signup
    description: Worker self-signup through an agency's signup link
  - name: auth
    description: Login, token refresh, logout and the current user
  - name: workers
    description: The agency's worker pool
  - name: clients
    description: The agency's customers, their locations and the qualifications a shift can ask for
  - name: shifts
    description: Shifts the agency creates and publishes
  - name: shift-templates
    description: Named shift templates the agency starts new shifts from
  - name: assignments
    description: The claims on a shift and the agency's decisions on them
  - name: settings
    description: Workflow settings of the agency
  - name: worker-shifts
    description: What a worker sees of the agency's shifts, claiming a spot, and the shifts they claimed
  - name: messages
    description: The conversation between each worker and the agency, system messages and broadcasts
  - name: notifications
    description: Push notification devices and preferences of a worker
  - name: hours
    description: Check-in and check-out, and the hours the agency approves for payroll
  - name: waitlist
    description: The line of workers waiting for a spot on a full shift
  - name: client-users
    description: Portal access for the staff of the agency's clients (ADR 0032)
  - name: client-portal
    description: What a client's staff see of their shifts in the portal, and the staff they request (ADR 0032)
  - name: staff-requests
    description: Clients' requests for staff, which dispatchers turn into shifts or decline (ADR 0032)
security:
  - bearerAuth: []
paths:
  /ping:
    get:
      operationId: ping
      tags: [system]
      summary: Check that the API is reachable
      description: Returns the service status and API version. Needs no authentication.
      security: []
      responses:
        "200":
          description: The API is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ping"
        default:
          $ref: "#/components/responses/Problem"

  /signup/{signupCode}:
    parameters:
      - $ref: "#/components/parameters/SignupCode"
    get:
      operationId: getSignupInfo
      tags: [signup]
      summary: Look up the agency behind a signup link
      description: |
        Returns what the signup form needs: the agency's name. Needs no
        authentication.

        Error codes: `signup_code_unknown` (404).
      security: []
      responses:
        "200":
          description: The agency the code belongs to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupInfo"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: signUp
      tags: [signup]
      summary: Sign up as a worker of the agency
      description: |
        Creates a user account and a worker profile with status `PENDING` and
        logs the worker in. The agency approves or rejects the signup later.
        Needs no authentication.

        `dateOfBirth` must be a real calendar date in the past. Its field
        error codes are `required`, `invalid_format` (not a date) and
        `out_of_range` (today or later, or more than 120 years ago).

        Error codes: `validation_failed` (400, with `errors`),
        `signup_code_unknown` (404), `email_already_registered` (409).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerSignupRequest"
      responses:
        "201":
          description: The account was created; the worker is logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /client-setup/{setupCode}:
    parameters:
      - $ref: "#/components/parameters/SetupCode"
    get:
      operationId: getClientSetupInfo
      tags: [client-users]
      summary: Look up the invitation behind a setup link
      description: |
        What the set-password form shows: who is invited, for which client
        and agency. Needs no authentication.

        Error codes: `setup_code_invalid` (404, unknown, already used or
        expired), `client_portal_off` (403).
      security: []
      responses:
        "200":
          description: The invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientSetupInfo"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: completeClientSetup
      tags: [client-users]
      summary: Set a password and log in to the client portal
      description: |
        Uses up the setup code, sets the password of the client user and logs
        them in. Needs no authentication.

        Field error codes: `required`, `invalid_length` (`password`).

        Error codes: `validation_failed` (400, with `errors`),
        `client_portal_off` (403), `setup_code_invalid` (404).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientSetupRequest"
      responses:
        "200":
          description: The password is set; the client user is logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      description: |
        Workers log in to the worker app; dispatchers, admins and client users
        to the dashboard. The request names the client it comes from; a role
        on the wrong client is rejected. Client users can log in only while
        the agency has the client portal switched on and their access is
        active.

        Error codes: `validation_failed` (400), `invalid_credentials` (401,
        the same for an unknown email and a wrong password), `wrong_client`
        (403), `client_portal_off` (403), `account_deactivated` (403),
        `too_many_attempts` (429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Exchange a refresh token for a new token pair
      description: |
        The refresh token is single use; the response contains its
        replacement. Deactivating a client user revokes their refresh tokens.

        Error codes: `invalid_refresh_token` (401, unknown, expired, revoked or
        already used), `client_portal_off` (403, a client user while the
        agency has the portal switched off).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: A new token pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the session on this device
      description: |
        Revokes the given refresh token. Succeeds even if the token is unknown
        or already revoked. Needs no access token, so logging out works after
        the access token has expired.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "204":
          description: The session has ended.
        default:
          $ref: "#/components/responses/Problem"

  /me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: The logged-in user
      description: |
        Returns the account, its agency and, for workers, the worker profile
        with its current status. The worker app calls this on start to decide
        between the shift list, the waiting screen and the inactive screen.
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /workers:
    get:
      operationId: listWorkers
      tags: [workers]
      summary: List the agency's workers
      description: |
        Dispatchers and admins only. Sorted by signup time, oldest first.

        Error codes: `forbidden` (403).
      parameters:
        - name: status
          in: query
          description: Only workers with this status.
          schema:
            $ref: "#/components/schemas/WorkerStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: One page of workers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerPage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /workers/{workerId}/approve:
    parameters:
      - $ref: "#/components/parameters/WorkerId"
    post:
      operationId: approveWorker
      tags: [workers]
      summary: Approve a pending signup
      description: |
        Sets the worker to `ACTIVE`. Dispatchers and admins only.

        Error codes: `forbidden` (403), `worker_not_found` (404),
        `worker_not_pending` (409).
      responses:
        "200":
          description: The approved worker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /workers/{workerId}/reject:
    parameters:
      - $ref: "#/components/parameters/WorkerId"
    post:
      operationId: rejectWorker
      tags: [workers]
      summary: Reject a pending signup
      description: |
        Sets the worker to `INACTIVE`. Dispatchers and admins only.

        Error codes: `forbidden` (403), `worker_not_found` (404),
        `worker_not_pending` (409).
      responses:
        "200":
          description: The rejected worker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List the agency's clients with their locations
      description: |
        What the shift form offers to choose from. Dispatchers and admins
        only. Sorted by name; the locations of a client are sorted by name too.

        Error codes: `forbidden` (403).
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: One page of clients.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientPage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /clients/{clientId}/users:
    parameters:
      - $ref: "#/components/parameters/ClientId"
    get:
      operationId: listClientUsers
      tags: [client-users]
      summary: The portal users of a client
      description: |
        Sorted by last and first name. Dispatchers and admins only.

        Error codes: `forbidden` (403), `client_not_found` (404).
      responses:
        "200":
          description: The client's users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientUser"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: inviteClientUser
      tags: [client-users]
      summary: Give someone at the client access to the portal
      description: |
        Creates a client user with status `INVITED` and returns a one-time
        setup code for the dashboard to turn into a link
        (`/client-setup/{setupCode}`). The code works once and expires after
        7 days. Only while the client portal is switched on. Dispatchers and
        admins only.

        Field error codes: `required`, `invalid_length` (`firstName`,
        `lastName`), `invalid_format` (`email`).

        Error codes: `validation_failed` (400, with `errors`),
        `forbidden` (403), `client_portal_off` (403), `client_not_found`
        (404), `email_already_registered` (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUserRequest"
      responses:
        "201":
          description: The new client user and their setup code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientUserInvitation"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /clients/{clientId}/users/{userId}/setup-link:
    parameters:
      - $ref: "#/components/parameters/ClientId"
      - $ref: "#/components/parameters/ClientUserId"
    post:
      operationId: renewClientUserSetupLink
      tags: [client-users]
      summary: Create a new setup code for a user who hasn't set a password
      description: |
        The earlier code stops working. Only while the client portal is
        switched on. Dispatchers and admins only.

        Error codes: `forbidden` (403), `client_portal_off` (403),
        `client_user_not_found` (404), `client_user_not_invited` (409, the
        user has set a password or is deactivated).
      responses:
        "200":
          description: The user and their new setup code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientUserInvitation"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /clients/{clientId}/users/{userId}/deactivate:
    parameters:
      - $ref: "#/components/parameters/ClientId"
      - $ref: "#/components/parameters/ClientUserId"
    post:
      operationId: deactivateClientUser
      tags: [client-users]
      summary: End a client user's access
      description: |
        The user can no longer log in, their sessions end and an open setup
        code stops working. Deactivating twice changes nothing. Dispatchers
        and admins only.

        Error codes: `forbidden` (403), `client_user_not_found` (404).
      responses:
        "200":
          description: The deactivated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientUser"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /qualifications:
    get:
      operationId: listQualifications
      tags: [clients]
      summary: List the agency's qualifications
      description: |
        The qualifications a shift can require. Dispatchers and admins only.
        Sorted by name.

        Error codes: `forbidden` (403).
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: One page of qualifications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualificationPage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /agency/settings:
    get:
      operationId: getAgencySettings
      tags: [settings]
      summary: The agency's workflow settings
      description: |
        Dispatchers and admins.

        Error codes: `forbidden` (403).
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgencySettings"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateAgencySettings
      tags: [settings]
      summary: Change the agency's workflow settings
      description: |
        Applies to claims and cancellations made afterwards; decisions already
        made stay as they are. Switching `waitlist` off stops new entries;
        workers already waiting stay in line. Admins only.

        Field error codes: `required`, `out_of_range`
        (`cancellationDeadlineHours` below 0 or above 336).

        Error codes: `validation_failed` (400, with `errors`), `forbidden`
        (403, not an admin).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgencySettings"
      responses:
        "200":
          description: The changed settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgencySettings"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /agency/features:
    get:
      operationId: getAgencyFeatures
      tags: [settings]
      summary: The optional features the agency has switched on
      description: |
        Dispatchers and admins.

        Error codes: `forbidden` (403).
      responses:
        "200":
          description: The features.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgencyFeatures"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateAgencyFeatures
      tags: [settings]
      summary: Switch optional features on or off
      description: |
        Admins only.

        Field error codes: `required`.

        Error codes: `validation_failed` (400, with `errors`), `forbidden`
        (403, not an admin).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgencyFeatures"
      responses:
        "200":
          description: The changed features.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgencyFeatures"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /conversations:
    get:
      operationId: listConversations
      tags: [messages]
      summary: The agency's shared inbox
      description: |
        Every worker conversation that has a message, the most recent message
        first, with how many of the worker's messages nobody at the agency has
        read yet. Dispatchers and admins only; any of them can answer any
        conversation.

        Error codes: `forbidden` (403).
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: One page of conversations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationPage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /conversations/unread-count:
    get:
      operationId: getInboxUnreadCount
      tags: [messages]
      summary: How many worker messages nobody at the agency has read
      description: |
        For the badge of the inbox. Dispatchers and admins only.

        Error codes: `forbidden` (403).
      responses:
        "200":
          description: The count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /conversations/events:
    get:
      operationId: streamInboxEvents
      tags: [messages]
      summary: Live notices when a conversation of the agency changes
      description: |
        A server-sent event stream (`text/event-stream`) that stays open. Each
        `conversation` event carries a `ConversationEvent` as JSON in its
        `data`: which conversation changed and how. Clients then reload the
        inbox or the open conversation through the endpoints above; the
        notice carries no message data. A comment line (`: ping`) every 25
        seconds keeps idle connections open; clients that hear nothing for 60
        seconds reconnect. The stream ends when the access token expires.
        Dispatchers and admins only; the access token goes in the
        `Authorization` header, so clients read the stream with a
        streaming HTTP request rather than `EventSource`. When the stream
        ends or fails, clients reconnect with backoff and fall back to
        polling meanwhile (ADR 0031).

        Error codes: `forbidden` (403).
      responses:
        "200":
          description: An open stream of `conversation` events.
          content:
            text/event-stream:
              schema:
                type: string
                description: Events named `conversation` whose `data` is a `ConversationEvent`.
                contentSchema:
                  $ref: "#/components/schemas/ConversationEvent"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /conversations/{conversationId}/messages:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: listConversationMessages
      tags: [messages]
      summary: The messages of one conversation
      description: |
        Newest first; the first page is what a chat shows at the bottom.
        Marks the worker's messages in it as read. Dispatchers and admins only.

        Error codes: `forbidden` (403), `conversation_not_found` (404).
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: One page of messages, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: replyToConversation
      tags: [messages]
      summary: Answer a worker
      description: |
        Sends a text message from the agency to the worker. Dispatchers and
        admins only.

        Field error codes: `required`, `invalid_length` (`body`), `not_found`
        (`shiftId` is not a published, completed or cancelled shift of the
        agency).

        Error codes: `validation_failed` (400, with `errors`), `forbidden`
        (403), `conversation_not_found` (404).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageRequest"
      responses:
        "201":
          description: The sent message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /shifts:
    get:
      operationId: listShifts
      tags: [shifts]
      summary: List the agency's upcoming or past shifts
      description: |
        `UPCOMING` (the default): draft, published and cancelled shifts that
        have not ended yet, sorted by start time, earliest first. `PAST`:
        published, completed and cancelled shifts that have ended, latest
        start first; drafts that were never published are left out.
        Dispatchers and admins only.

        Error codes: `forbidden` (403).
      parameters:
        - name: period
          in: query
          description: Which shifts to list.
          schema:
            $ref: "#/components/schemas/ShiftPeriod"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: One page of shifts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftPage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createShift
      tags: [shifts]
      summary: Create a shift
      description: |
        Creates the shift as `DRAFT`, or as `PUBLISHED` when `publish` is
        true. Dispatchers and admins only.

        Field error codes: `required`, `invalid_format`, `invalid_length`,
        `out_of_range` (`hourlyRateCents` below 1, `slots` below 1 or above
        500), `before_start` (`endsAt` is not after `startsAt`) and
        `not_found` (`clientId` is not a client of the agency, `locationId` is
        not a location of that client, or `qualificationIds` contains an
        unknown qualification).

        Error codes: `validation_failed` (400, with `errors`), `forbidden`
        (403).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftRequest"
      responses:
        "201":
          description: The created shift.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /shifts/{shiftId}:
    parameters:
      - $ref: "#/components/parameters/ShiftId"
    get:
      operationId: getShift
      tags: [shifts]
      summary: One shift of the agency
      description: |
        Any shift of the agency, drafts included. Dispatchers and admins only.

        Error codes: `forbidden` (403), `shift_not_found` (404).
      responses:
        "200":
          description: The shift.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateShift
      tags: [shifts]
      summary: Change a shift
      description: |
        Replaces every field of a draft, or of a published shift that has
        not started yet; its status, spots taken and claims stay. Workers who
        hold a spot get a system message that says what changed, and a push.
        Saving without a change tells nobody. Dispatchers and admins only.

        Field error codes: the same as when creating a shift, plus
        `below_taken` (`slots` is below the spots that confirmed and pending
        claims hold).

        Error codes: `validation_failed` (400, with `errors`), `forbidden`
        (403), `shift_not_found` (404), and with 409: `shift_not_editable`
        (the shift has started, ended, or is cancelled or completed),
        `shift_overlap` (at the new time, a worker who holds a spot would
        overlap another shift they hold) and `concurrent_change` (the shift
        kept changing at the same moment; try again).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftChangeRequest"
      responses:
        "200":
          description: The changed shift.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /shifts/{shiftId}/publish:
    parameters:
      - $ref: "#/components/parameters/ShiftId"
    post:
      operationId: publishShift
      tags: [shifts]
      summary: Publish a draft
      description: |
        Sets the shift to `PUBLISHED`, so that workers can see and claim it.
        Dispatchers and admins only.

        Error codes: `forbidden` (403), `shift_not_found` (404),
        `shift_not_draft` (409).
      responses:
        "200":
          description: The published shift.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /shifts/{shiftId}/cancel:
    parameters:
      - $ref: "#/components/parameters/ShiftId"
    post:
      operationId: cancelShift
      tags: [shifts]
      summary: Call off a shift
      description: |
        Sets a draft or published shift that has not ended to `CANCELLED`,
        together with all its pending and confirmed assignments (`cancelledBy`
        is `AGENCY`).
        Dispatchers and admins only.

        Error codes: `forbidden` (403), `shift_not_found` (404), and with 409:
        `shift_not_cancellable` (the shift has ended or is already
        cancelled) and `concurrent_change` (the shift kept changing at the
        same moment; try again).
      responses:
        "200":
          description: The cancelled shift.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /shifts/{shiftId}/broadcast:
    parameters:
      - $ref: "#/components/parameters/ShiftId"
    post:
      operationId: broadcastToShift
      tags: [messages]
      summary: Message all confirmed workers of a shift
      description: |
        Puts the message into the conversation of every worker whose
        assignment on the shift is `CONFIRMED`, tagged with the shift and
        typed `BROADCAST`. Others do not get it. Dispatchers and admins only.

        Field error codes: `required`, `invalid_length` (`body`).

        Error codes: `validation_failed` (400, with `errors`), `forbidden`
        (403), `shift_not_found` (404), `no_recipients` (409, nobody is
        confirmed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BroadcastRequest"
      responses:
        "201":
          description: How many workers got the message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /shifts/{shiftId}/assignments:
    parameters:
      - $ref: "#/components/parameters/ShiftId"
    get:
      operationId: listShiftAssignments
      tags: [assignments]
      summary: List the claims on a shift
      description: |
