        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: One page of requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffRequestPage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /staff-requests/{requestId}:
    parameters:
      - $ref: "#/components/parameters/StaffRequestId"
    get:
      operationId: getStaffRequest
      tags: [staff-requests]
      summary: One request for staff
      description: |
        Dispatchers and admins only.

        Error codes: `forbidden` (403), `staff_request_not_found` (404).
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffRequest"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /staff-requests/{requestId}/shift:
    parameters:
      - $ref: "#/components/parameters/StaffRequestId"
    post:
      operationId: createShiftFromStaffRequest
      tags: [staff-requests]
      summary: Turn an open request into a shift
      description: |
        Creates the shift like `POST /shifts` and, in the same step, links
        it to the request and sets the request to `ACCEPTED`. The client
        sees the shift once it is published. The dispatcher becomes the
        contact person. Dispatchers and admins only.

        Field error codes: as for `POST /shifts`, plus `not_request_client`
        (`clientId` is not the client who sent the request).

        Error codes: `validation_failed` (400, with `errors`), `forbidden`
        (403), `staff_request_not_found` (404), `staff_request_not_open`
        (409, withdrawn, declined or already turned into a shift).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftRequest"
      responses:
        "201":
          description: The created shift.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /staff-requests/{requestId}/decline:
    parameters:
      - $ref: "#/components/parameters/StaffRequestId"
    post:
      operationId: declineStaffRequest
      tags: [staff-requests]
      summary: Decline an open request, with a reason the client sees
      description: |
        Dispatchers and admins only.

        Error codes: `validation_failed` (400, with `errors`), `forbidden`
        (403), `staff_request_not_found` (404), `staff_request_not_open`
        (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffRequestDecline"
      responses:
        "200":
          description: The declined request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffRequest"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /worker/shifts:
    get:
      operationId: listWorkerShifts
      tags: [worker-shifts]
      summary: List the shifts a worker can claim
      description: |
        The agency's published shifts that have not started yet, sorted by
        start time, earliest first. Full shifts are included, so that the app
        can show them as full. A shift the worker has claimed carries their
        `assignment`. Active workers only.

        Qualifications are not matched: every active worker sees every
        published shift, and `qualifications` is information for the worker.

        Error codes: `forbidden` (403, not a worker), `worker_not_active`
        (403, the signup is pending or the worker is inactive).
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: One page of shifts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerShiftPage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /worker/shifts/{shiftId}:
    parameters:
      - $ref: "#/components/parameters/ShiftId"
    get:
      operationId: getWorkerShift
      tags: [worker-shifts]
      summary: One shift as a worker sees it
      description: |
        A published, completed or cancelled shift of the agency, whether or
        not it has started, so that the detail of a claimed shift stays
        reachable. A draft does not exist for workers. Active workers only.

        Error codes: `forbidden` (403), `worker_not_active` (403),
        `shift_not_found` (404).
      responses:
        "200":
          description: The shift.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerShift"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /worker/shifts/{shiftId}/claim:
    parameters:
      - $ref: "#/components/parameters/ShiftId"
    post:
      operationId: claimShift
      tags: [worker-shifts]
      summary: Claim a spot on a shift
      description: |
        Creates the worker's assignment as `PENDING` and counts the spot as
        taken. When two workers claim the last spot at the same time, one of
        them gets `shift_full`. The claim is not checked against the shift's
        qualifications. A worker on the shift's waitlist can claim a free spot
        too; their place in line becomes the claim. Active workers only.

        Error codes: `forbidden` (403), `worker_not_active` (403),
        `shift_not_found` (404), and with 409: `shift_full` (no spot left),
        `shift_already_claimed` (the worker has claimed this shift before,
        whatever became of that claim), `shift_started` (the start time has
        passed), `shift_not_open` (cancelled or completed) and
        `shift_overlap` (it overlaps one of the worker's pending or confirmed
        shifts).
      responses:
        "201":
          description: The shift with the worker's new assignment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerShift"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /worker/shifts/{shiftId}/cancel:
    parameters:
      - $ref: "#/components/parameters/ShiftId"
    post:
      operationId: cancelClaim
      tags: [worker-shifts]
      summary: Drop out of a claimed shift
      description: |
        Sets the worker's pending or confirmed assignment to `CANCELLED` with
        `cancelledBy` `WORKER` and frees the spot. Possible until
        `assignment.cancellableUntil`, which follows from the agency's
        cancellation deadline; afterwards the worker has to contact the
        agency. Active workers only.

        Error codes: `forbidden` (403), `worker_not_active` (403),
        `shift_not_found` (404), `assignment_not_found` (404, the worker has
        not claimed the shift), and with 409: `assignment_not_active` (not
        pending or confirmed), `cancellation_deadline_passed` and
        `concurrent_change` (the shift kept changing at the same moment; try
        again).
      responses:
        "200":
          description: The shift with the worker's cancelled assignment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerShift"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /worker/shifts/{shiftId}/waitlist:
    parameters:
      - $ref: "#/components/parameters/ShiftId"
    post:
      operationId: joinWaitlist
      tags: [waitlist]
      summary: Join the waitlist of a full shift
      description: |
        Puts the worker at the back of the shift's waitlist. A place in line
        holds no spot. When a spot frees up before the cancellation deadline,
        the first in line moves up into a claim (pending, or confirmed when
        the agency confirms automatically) and gets a system message and a
        push; after the deadline, everyone waiting gets a push and the first
        to claim gets the spot (ADR 0029). Active workers only.

        Error codes: `forbidden` (403), `worker_not_active` (403),
        `shift_not_found` (404), and with 409: `waitlist_disabled` (the
        agency does not use the waitlist), `shift_not_full` (claim instead),
        `shift_already_claimed` (the worker has claimed this shift before),
        `already_on_waitlist`, `shift_started`, `shift_not_open` (cancelled
        or completed) and `shift_overlap` (it overlaps one of the worker's
        pending or confirmed shifts).
      responses:
        "201":
          description: The shift with the worker's place on the waitlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerShift"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: leaveWaitlist
      tags: [waitlist]
      summary: Leave the waitlist of a shift
      description: |
        Takes the worker off the waitlist without a trace; they can join
        again at the back of the line. Possible until the shift starts, also
        when the agency has switched the waitlist off. Active workers only.

        Error codes: `forbidden` (403), `worker_not_active` (403),
        `shift_not_found` (404), `not_on_waitlist` (404), `shift_started`
        (409).
      responses:
        "200":
          description: The shift without the worker's place.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerShift"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /worker/shifts/{shiftId}/check-in:
    parameters:
      - $ref: "#/components/parameters/ShiftId"
    post:
      operationId: checkIn
      tags: [hours]
      summary: Check in on arrival
      description: |
        Records the time the worker arrived. Possible once, with a confirmed
        spot, from `assignment.checkInFrom` until the shift's end, when the
        agency uses check-in. No location is stored. Active workers only.

        Error codes: `forbidden` (403), `worker_not_active` (403),
        `shift_not_found` (404), `assignment_not_found` (404, the worker has
        not claimed the shift), and with 409: `check_in_disabled` (the agency
        does not use check-in), `assignment_not_confirmed`,
        `check_in_not_open` (too early or after the end) and
        `already_checked_in`.
      responses:
        "200":
          description: The shift with the worker's assignment and its check-in time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerShift"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /worker/shifts/{shiftId}/check-out:
    parameters:
      - $ref: "#/components/parameters/ShiftId"
    post:
      operationId: checkOut
      tags: [hours]
      summary: Check out when leaving
      description: |
        Records the time the worker left. Possible once after checking in,
        also after the planned end, until the agency approved the hours.
        Active workers only.

        Error codes: `forbidden` (403), `worker_not_active` (403),
        `shift_not_found` (404), `assignment_not_found` (404), and with 409:
        `check_in_disabled`, `assignment_not_confirmed` (the worker no longer
        holds the spot), `not_checked_in`, `already_checked_out` and
        `hours_approved`.
      responses:
        "200":
          description: The shift with the worker's assignment and its check-out time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerShift"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /worker/my-shifts:
    get:
      operationId: listMyShifts
      tags: [worker-shifts]
      summary: List the shifts the worker has claimed
      description: |
        Every shift the worker has an assignment for, whatever its status,
        sorted by start time, earliest first. Each shift carries the
        `assignment`. With `includeWaitlist`, the shifts the worker is waiting
        for are listed too, carrying `waitlist` instead of `assignment`.
        Active workers only.

        Error codes: `forbidden` (403), `worker_not_active` (403).
      parameters:
        - name: includeWaitlist
          in: query
          description: |
            Also list the shifts the worker is on the waitlist for. False by
            default, so that app versions that know no waitlist see none.
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: One page of claimed shifts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerShiftPage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /worker/conversation:
    get:
      operationId: getMyConversation
      tags: [messages]
      summary: The worker's conversation with the agency
      description: |
        How many messages from the agency the worker has not read yet. There is
        one conversation per worker; before the first message it is empty.
        Active workers only.

        Error codes: `forbidden` (403), `worker_not_active` (403).
      responses:
        "200":
          description: The count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /worker/conversation/events:
    get:
      operationId: streamMyConversationEvents
      tags: [messages]
      summary: Live notices when the worker's conversation changes
      description: |
        A server-sent event stream (`text/event-stream`) that stays open while
        the app is in the foreground. Each `conversation` event carries a
        `ConversationEvent` as JSON in its `data`; the app then reloads the
        conversation or its unread count. A comment line (`: ping`) every 25
        seconds keeps idle connections open; clients that hear nothing for 60
        seconds reconnect. The stream ends when the access token expires. Active workers only; the access token goes in the
        `Authorization` header (ADR 0031).

        Error codes: `forbidden` (403), `worker_not_active` (403).
      responses:
        "200":
          description: An open stream of `conversation` events.
          content:
            text/event-stream:
              schema:
                type: string
                description: Events named `conversation` whose `data` is a `ConversationEvent`.
                contentSchema:
                  $ref: "#/components/schemas/ConversationEvent"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /worker/conversation/messages:
    get:
      operationId: listMyMessages
      tags: [messages]
      summary: The messages of the worker's conversation
      description: |
        Newest first. Marks the agency's messages, system messages and
        broadcasts in it as read. Active workers only.

        Error codes: `forbidden` (403), `worker_not_active` (403).
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: One page of messages, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Write to the agency
      description: |
        Sends a text message, optionally about a shift (`shiftId`), for
        example when started from the shift's detail. Active workers only.

        Field error codes: `required`, `invalid_length` (`body`), `not_found`
        (`shiftId` is not a shift the worker can see).

        Error codes: `validation_failed` (400, with `errors`), `forbidden`
        (403), `worker_not_active` (403).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageRequest"
      responses:
        "201":
          description: The sent message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /worker/push-tokens:
    post:
      operationId: registerPushToken
      tags: [notifications]
      summary: Register this device for push notifications
      description: |
        Stores the device's Firebase Cloud Messaging token for the worker.
        Registering a token again is harmless; a token that belonged to
        another account moves to this one. Workers only, also while pending.

        Field error codes: `required`, `invalid_length` (`token`).

        Error codes: `validation_failed` (400, with `errors`), `forbidden`
        (403).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenRequest"
      responses:
        "204":
          description: The token is registered.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /worker/push-tokens/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 4096
    delete:
      operationId: unregisterPushToken
      tags: [notifications]
      summary: Stop push notifications to this device
      description: |
        For logging out. Unknown tokens are ignored. Workers only.

        Error codes: `forbidden` (403).
      responses:
        "204":
          description: The device gets no more push notifications.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /worker/notification-settings:
    get:
      operationId: getNotificationSettings
      tags: [notifications]
      summary: The worker's notification preferences
      description: |
        Active workers only.

        Error codes: `forbidden` (403), `worker_not_active` (403).
      responses:
        "200":
          description: The preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateNotificationSettings
      tags: [notifications]
      summary: Pause or resume new-shift notifications
      description: |
        While `newShiftsPaused` is true, the worker gets no push for new
        shifts; claim decisions, cancellations and messages still reach them.
        Active workers only.

        Field error codes: `required`.

        Error codes: `validation_failed` (400, with `errors`), `forbidden`
        (403), `worker_not_active` (403).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationSettings"
      responses:
        "200":
          description: The changed preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /client/shifts:
    get:
      operationId: listClientShifts
      tags: [client-portal]
      summary: The client's shifts
      description: |
        Shifts the agency staffs for the logged-in user's client. Drafts are
        left out; cancelled shifts are included. `UPCOMING` lists shifts
        that haven't ended, earliest start first; `PAST` lists ended ones,
        latest start first. Client users only.

        Error codes: `forbidden` (403).
      parameters:
        - name: period
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ClientShiftPeriod"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: One page of shifts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientShiftPage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /client/shifts/{shiftId}:
    parameters:
      - $ref: "#/components/parameters/ShiftId"
    get:
      operationId: getClientShift
      tags: [client-portal]
      summary: One shift of the client, with who is coming
      description: |
        Lists the first and last names of the confirmed workers, nothing else
        about them. Client users only.

        Error codes: `forbidden` (403), `shift_not_found` (404, also for
        drafts and other clients' shifts).
      responses:
        "200":
          description: The shift.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientShiftDetail"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /client/locations:
    get:
      operationId: listClientLocations
      tags: [client-portal]
      summary: The locations of the client, to request staff for
      description: |
        Sorted by name. A client has a handful of locations, so the list is
        not paged. Client users only.

        Error codes: `forbidden` (403).
      responses:
        "200":
          description: The locations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /client/staff-requests:
    get:
      operationId: listClientStaffRequests
      tags: [client-portal]
      summary: The staff the client has requested
      description: |
        Requests sent by anyone at the logged-in user's client, newest
        first, whatever their status. Client users only.

        Error codes: `forbidden` (403).
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: One page of requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffRequestPage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createClientStaffRequest
      tags: [client-portal]
      summary: Ask the agency for staff
      description: |
        Creates the request as `OPEN`. Client users only.

        Field error codes: `required`, `invalid_length`, `out_of_range`
        (`workerCount` below 1 or above 500), `in_past` (`startsAt` has
        passed), `before_start` (`endsAt` is not after `startsAt`) and
        `not_found` (`locationId` is not a location of the client).

        Error codes: `validation_failed` (400, with `errors`), `forbidden`
        (403).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffRequestRequest"
      responses:
        "201":
          description: The created request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffRequest"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /client/staff-requests/{requestId}/withdraw:
    parameters:
      - $ref: "#/components/parameters/StaffRequestId"
    post:
      operationId: withdrawClientStaffRequest
      tags: [client-portal]
      summary: Withdraw an open request
      description: |
        Anyone at the client may withdraw any of the client's open
        requests. Client users only.

        Error codes: `forbidden` (403), `staff_request_not_found` (404, also
        for other clients' requests), `staff_request_not_open` (409).
      responses:
        "200":
          description: The withdrawn request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffRequest"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SignupCode:
      name: signupCode
      in: path
      required: true
      description: The code from the agency's signup link.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    WorkerId:
      name: workerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClientId:
      name: clientId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClientUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SetupCode:
      name: setupCode
      in: path
      required: true
      description: The code from a client user's setup link.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    ShiftId:
      name: shiftId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TemplateId:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StaffRequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: Page number, starting at 0.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Page size.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Problem:
      description: An error, described as RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Ping:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          description: Always `ok` when the API answers.
          examples: [ok]
        version:
          type: string
          description: Version of the API contract the backend implements.
          examples: ["0.1.0"]

    SignupInfo:
      type: object
      required: [agencyName]
      properties:
        agencyName:
          type: string
          examples: [Donau Personal]

    Qualification:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: [Service]

    WorkerSignupRequest:
      type: object
      required: [firstName, lastName, dateOfBirth, email, phone, password]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        dateOfBirth:
          type: string
          format: date
          examples: ["1998-04-17"]
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          minLength: 5
          maxLength: 30
          examples: ["+43 660 5550101"]
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128

    ClientType:
      type: string
      description: The client a login comes from.
      enum: [WORKER_APP, DASHBOARD]

    LoginRequest:
      type: object
      required: [email, password, client]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
        client:
          $ref: "#/components/schemas/ClientType"

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1

    TokenResponse:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken:
          type: string
          description: JWT, sent as bearer token.
        refreshToken:
          type: string
          description: Opaque, single-use token for `POST /auth/refresh`.
        expiresIn:
          type: integer
          format: int32
          description: Lifetime of the access token in seconds.

    Role:
      type: string
      description: |
        `CLIENT` is a user at one of the agency's clients (ADR 0032).
      enum: [ADMIN, DISPATCHER, WORKER, CLIENT]

    WorkerStatus:
      type: string
      description: |
        `PENDING` after signup, `ACTIVE` once the agency approved, `INACTIVE`
        after a rejection or deactivation.
      enum: [PENDING, ACTIVE, INACTIVE]

    AgencySummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        features:
          description: The optional features the agency has switched on.
          $ref: "#/components/schemas/AgencyFeatures"

    AgencyFeatures:
      type: object
      required: [contactButton]
      properties:
        contactButton:
          type: boolean
          description: |
            Workers see a WhatsApp button for the contact person on a shift,
            for agencies that prefer that over the in-app chat. Off by default.
        checkIn:
          type: boolean
          description: |
            Workers check in and out of their shifts in the app. Off by
            default. Always present in responses; absent in a request, it
            stays as it is.
        clientPortal:
          type: boolean
          description: |
            The staff of the agency's clients log in to see their shifts and
            who is coming (ADR 0032). Off by default. Always present in
            responses; absent in a request, it stays as it is.

    WorkerProfile:
      type: object
      required: [id, firstName, lastName, status]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        status:
          $ref: "#/components/schemas/WorkerStatus"

    CurrentUser:
      type: object
      required: [id, email, role, agency]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        agency:
          $ref: "#/components/schemas/AgencySummary"
        worker:
          description: Present when the role is `WORKER`.
          $ref: "#/components/schemas/WorkerProfile"
        client:
          description: Present when the role is `CLIENT`; the client the user belongs to.
          $ref: "#/components/schemas/ClientSummary"

    Worker:
      type: object
      required: [id, firstName, lastName, dateOfBirth, email, phone, status, qualifications, createdAt]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
          format: date
        email:
          type: string
          format: email
        phone:
          type: string
        status:
          $ref: "#/components/schemas/WorkerStatus"
        qualifications:
          type: array
          items:
            $ref: "#/components/schemas/Qualification"
        createdAt:
          type: string
          format: date-time
          description: When the worker signed up.

    WorkerPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Worker"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    QualificationPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Qualification"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    Location:
      type: object
      description: A site of a client where shifts take place.
      required: [id, name, address]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: [Zentrallager Linz]
        address:
          type: string
          description: Postal address in one line.
          examples: ["Industriezeile 40, 4020 Linz"]

    ClientSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: [Nordlicht Logistik]

    ClientUserStatus:
      type: string
      description: |
        `INVITED` until the user sets a password with their setup link,
        `ACTIVE` afterwards, `DEACTIVATED` once the agency ended their
        access.
      enum: [INVITED, ACTIVE, DEACTIVATED]

    ClientUser:
      type: object
      description: Someone at a client with access to the portal.
      required: [id, firstName, lastName, email, status]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        status:
          $ref: "#/components/schemas/ClientUserStatus"

    ClientUserRequest:
      type: object
      required: [firstName, lastName, email]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254

    ClientUserInvitation:
      type: object
      description: |
        A client user with a fresh setup code. The code is shown only here;
        the backend keeps a hash of it.
      required: [user, setupCode, expiresAt]
      properties:
        user:
          $ref: "#/components/schemas/ClientUser"
        setupCode:
          type: string
        expiresAt:
          type: string
          format: date-time

    ClientSetupInfo:
      type: object
      required: [firstName, email, clientName, agencyName]
      properties:
        firstName:
          type: string
        email:
          type: string
          format: email
        clientName:
          type: string
        agencyName:
          type: string

    ClientSetupRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128

    ClientShiftPeriod:
      type: string
      description: Shifts that haven't ended (`UPCOMING`, the default) or ended ones (`PAST`).
      enum: [UPCOMING, PAST]

    ClientShift:
      type: object
      description: |
        A shift as the client sees it: no hourly rate, no requests or
        waitlist (ADR 0032).
      required:
        - id
        - title
        - status
        - location
        - startsAt
        - endsAt
        - endIsEstimate
        - slots
        - confirmedCount
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          description: Never `DRAFT`.
          $ref: "#/components/schemas/ShiftStatus"
        location:
          $ref: "#/components/schemas/Location"
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        endIsEstimate:
          type: boolean
        slots:
          type: integer
          format: int32
          minimum: 1
        confirmedCount:
          type: integer
          format: int32
          minimum: 0
          description: Workers confirmed for the shift; pending requests don't count.

    ClientShiftPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ClientShift"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    ClientShiftWorker:
      type: object
      description: A confirmed worker, by name only.
      required: [firstName, lastName]
      properties:
        firstName:
          type: string
        lastName:
          type: string

    ClientShiftDetail:
      allOf:
        - $ref: "#/components/schemas/ClientShift"
        - type: object
          required: [description, confirmedWorkers]
          properties:
            description:
              type: string
              description: What the agency wrote about the shift; empty when it wrote nothing.
            confirmedWorkers:
              type: array
              description: Sorted by last and first name.
              items:
                $ref: "#/components/schemas/ClientShiftWorker"

    StaffRequestStatus:
      type: string
      description: |
        `OPEN` until a dispatcher handles it, then `ACCEPTED` (turned into a
        shift) or `DECLINED` (with a reason). `WITHDRAWN` when the client
        took it back while it was open.
      enum: [OPEN, ACCEPTED, DECLINED, WITHDRAWN]

    StaffRequestRequest:
      type: object
      required: [locationId, role, startsAt, endsAt, workerCount]
      properties:
        locationId:
          type: string
          format: uuid
          description: A location of the client.
        role:
          type: string
          minLength: 1
          maxLength: 120
          description: What the people will do; becomes the shift's title.
          examples: [Lagerhelfer]
        startsAt:
          type: string
          format: date-time
          description: Must not have passed.
        endsAt:
          type: string
          format: date-time
          description: Must be after `startsAt`.
        endIsEstimate:
          type: boolean
          default: false
          description: The end is approximate ("ca.").
        workerCount:
          type: integer
          format: int32
          minimum: 1
          maximum: 500
          description: How many people the client needs.
        notes:
          type: string
          maxLength: 2000
          description: Anything else the agency should know.

    StaffRequest:
      type: object
      description: |
        A client's request for staff. Clients and dispatchers get the same
        shape; it holds nothing about pay.
      required:
        - id
        - status
        - client
        - location
        - role
        - startsAt
        - endsAt
        - endIsEstimate
        - workerCount
        - notes
        - requestedBy
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/StaffRequestStatus"
        client:
          $ref: "#/components/schemas/ClientSummary"
        location:
          $ref: "#/components/schemas/Location"
        role:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        endIsEstimate:
          type: boolean
        workerCount:
          type: integer
          format: int32
          minimum: 1
        notes:
          type: string
          description: Empty when the client wrote nothing.
        requestedBy:
          type: string
          description: Full name of the client user who sent the request.
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
          description: When it was accepted, declined or withdrawn; absent while open.
        declineReason:
          type: string
          description: Why the agency declined; only when `DECLINED`.
        shiftId:
          type: string
          format: uuid
          description: |
            The shift the request was turned into; only when `ACCEPTED`.
            Clients get it only once the shift is published, since they
            never see drafts.

    StaffRequestPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/StaffRequest"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    StaffRequestDecline:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Shown to the client.

    Client:
      type: object
      description: A customer of the agency, with the locations shifts can take place at.
      required: [id, name, locations]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: [Nordlicht Logistik]
        locations:
          type: array
          items:
            $ref: "#/components/schemas/Location"

    ClientPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Client"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    ShiftStatus:
      type: string
      description: |
        `DRAFT` until the agency publishes it, `PUBLISHED` while workers can
        see it, `COMPLETED` after it took place, `CANCELLED` when the agency
        called it off. Whether a published shift is full follows from
        `takenSlots` and `slots`.
      enum: [DRAFT, PUBLISHED, COMPLETED, CANCELLED]

    ShiftPeriod:
      type: string
      description: |
        `UPCOMING`: shifts that have not ended yet. `PAST`: shifts that have
        ended.
      enum: [UPCOMING, PAST]
      default: UPCOMING

    ShiftRequest:
      type: object
      required: [clientId, locationId, title, startsAt, endsAt, hourlyRateCents, slots]
      properties:
        clientId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
          description: A location of the client.
        title:
          type: string
          minLength: 1
          maxLength: 120
          examples: [Lagerunterstützung]
        description:
          type: string
          maxLength: 2000
          description: What to bring, the meeting point and anything else workers need to know.
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
          description: Must be after `startsAt`.
        endIsEstimate:
          type: boolean
          default: false
          description: The end is approximate; clients show it with "ca.".
        hourlyRateCents:
          type: integer
          format: int32
          minimum: 1
          description: Gross pay per hour in euro cents.
          examples: [1650]
        slots:
          type: integer
          format: int32
          minimum: 1
          maximum: 500
          description: How many workers the shift needs.
        qualificationIds:
          type: array
          description: |
            Qualifications the shift asks for. Workers see them on the shift;
            a claim is not checked against them. Empty or absent means none.
          uniqueItems: true
          items:
            type: string
            format: uuid
        publish:
          type: boolean
          default: false
          description: Publish the shift right away instead of saving it as a draft.

    ShiftChangeRequest:
      type: object
      description: Every field of a shift, as when creating one; the status does not change.
      required: [clientId, locationId, title, startsAt, endsAt, hourlyRateCents, slots]
      properties:
        clientId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
          description: A location of the client.
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
          description: Absent or empty removes the description.
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
          description: Must be after `startsAt`.
        endIsEstimate:
          type: boolean
          default: false
        hourlyRateCents:
          type: integer
          format: int32
          minimum: 1
          description: Gross pay per hour in euro cents.
        slots:
          type: integer
          format: int32
          minimum: 1
          maximum: 500
          description: Not below the spots taken.
        qualificationIds:
          type: array
          description: Empty or absent means none.
          uniqueItems: true
          items:
            type: string
            format: uuid

    Shift:
      type: object
      required:
        - id
        - title
        - status
        - client
        - location
        - startsAt
        - endsAt
        - endIsEstimate
        - hourlyRateCents
        - slots
        - takenSlots
        - waitingCount
        - qualifications
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/ShiftStatus"
        client:
          $ref: "#/components/schemas/ClientSummary"
        location:
          $ref: "#/components/schemas/Location"
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        endIsEstimate:
          type: boolean
        hourlyRateCents:
          type: integer
          format: int32
          description: Gross pay per hour in euro cents.
        slots:
          type: integer
          format: int32
          description: How many workers the shift needs.
        takenSlots:
          type: integer
          format: int32
          description: How many of the slots are claimed.
        waitingCount:
          type: integer
          format: int32
          minimum: 0
          description: How many workers are on the shift's waitlist.
        qualifications:
          type: array
          description: Qualifications the shift asks for. Information only; a claim is not checked against them.
          items:
            $ref: "#/components/schemas/Qualification"
        createdAt:
          type: string
          format: date-time

    ShiftPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Shift"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    ShiftTemplateRequest:
      type: object
      required: [name, clientId, locationId, title, startTime, durationMinutes, hourlyRateCents, slots]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Unique within the agency, ignoring case.
          examples: [Lager Frühschicht]
        clientId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
          description: A location of the client.
        title:
          type: string
          minLength: 1
          maxLength: 120
          examples: [Lagerunterstützung]
        description:
          type: string
          maxLength: 2000
        startTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: |
            Local time of day the shift starts, `hh:mm`. Clients turn it into
            a point in time on the date the dispatcher picks.
          examples: ["07:00"]
        durationMinutes:
          type: integer
          format: int32
          minimum: 1
          maximum: 1439
          description: How long the shift runs. A shift that runs past midnight ends on the next day.
          examples: [480]
        endIsEstimate:
          type: boolean
          default: false
        hourlyRateCents:
          type: integer
          format: int32
          minimum: 1
          description: Gross pay per hour in euro cents.
        slots:
          type: integer
          format: int32
          minimum: 1
          maximum: 500
        qualificationIds:
          type: array
          description: Empty or absent means none.
          uniqueItems: true
          items:
            type: string
            format: uuid

    ShiftTemplate:
      type: object
      description: |
        A shift without a date. Client, location and qualifications are ids;
        one that no longer exists is left out of the form a template fills in.
      required:
        - id
        - name
        - clientId
        - locationId
        - title
        - startTime
        - durationMinutes
        - endIsEstimate
        - hourlyRateCents
        - slots
        - qualificationIds
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        clientId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        startTime:
          type: string
          description: Local time of day, `hh:mm`.
          examples: ["07:00"]
        durationMinutes:
          type: integer
          format: int32
        endIsEstimate:
          type: boolean
        hourlyRateCents:
          type: integer
          format: int32
          description: Gross pay per hour in euro cents.
        slots:
          type: integer
          format: int32
        qualificationIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        createdAt:
          type: string
          format: date-time

    ShiftTemplatePage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ShiftTemplate"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    AssignmentStatus:
      type: string
      description: |
        `PENDING` after the claim, `CONFIRMED` once the agency approved,
        `REJECTED` when it declined, `CANCELLED` when the worker dropped out,
        the agency removed them or the shift was called off, `COMPLETED` after
        the shift took place, `NO_SHOW` when the worker did not turn up.
        Pending and confirmed assignments hold a spot.
      enum: [PENDING, CONFIRMED, REJECTED, CANCELLED, COMPLETED, NO_SHOW]

    CancelledBy:
      type: string
      description: |
        Who cancelled an assignment: `WORKER` when they dropped out, `AGENCY`
        when the agency removed them or called off the shift.
      enum: [WORKER, AGENCY]

    AssignmentSummary:
      type: object
      description: A worker's claim on a shift.
      required: [id, status, claimedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/AssignmentStatus"
        claimedAt:
          type: string
          format: date-time
        cancellableUntil:
          type: string
          format: date-time
          description: |
            Until when the worker can drop out in the app. Present while the
            assignment is pending or confirmed; may already be in the past.
        cancelledBy:
          description: Present when the status is `CANCELLED`.
          $ref: "#/components/schemas/CancelledBy"
        checkInFrom:
          type: string
          format: date-time
          description: |
            From when the worker can check in; possible until the shift's end.
            Present when the agency uses check-in and the assignment is
            confirmed or completed; clients show check-in and check-out only
            then.
        checkedInAt:
          type: string
          format: date-time
          description: When the worker checked in.
        checkedOutAt:
          type: string
          format: date-time
          description: When the worker checked out.
        hoursApproved:
          type: boolean
          description: The agency approved the hours; checking out is no longer possible.

    AssignedWorker:
      type: object
      description: The worker behind a claim, as the agency sees them.
      required: [id, firstName, lastName, phone]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
          examples: ["+43 660 5550101"]

    ShiftAssignment:
      type: object
      description: A claim on a shift as the agency sees it.
      required: [id, status, worker, claimedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/AssignmentStatus"
        worker:
          $ref: "#/components/schemas/AssignedWorker"
        claimedAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
          description: When the claim was last decided on, cancelled or completed. Absent while pending.
        cancelledBy:
          description: Present when the status is `CANCELLED`.
          $ref: "#/components/schemas/CancelledBy"
        reason:
          type: string
          description: Why the agency removed the worker. Present only for a removal.
        checkedInAt:
          type: string
          format: date-time
          description: When the worker checked in in the app.
        checkedOutAt:
          type: string
          format: date-time
          description: When the worker checked out in the app.
        hours:
          description: The approved hours. Absent until the agency approved them.
          $ref: "#/components/schemas/WorkedHours"

    ShiftAssignmentPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ShiftAssignment"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    RemoveAssignmentRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          examples: [Kann laut Rücksprache nicht kommen]

    HoursRequest:
      type: object
      description: The hours a worker worked, as the agency approves them.
      required: [startedAt, endedAt, breakMinutes]
      properties:
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          description: After `startedAt`, at most 24 hours later.
        breakMinutes:
          type: integer
          format: int32
          minimum: 0
          maximum: 1440
          description: Unpaid break. Shorter than the time between start and end.

    WorkedHours:
      type: object
      description: Approved hours of one worker on one shift.
      required: [startedAt, endedAt, breakMinutes, workedMinutes, grossCents, approvedAt]
      properties:
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        breakMinutes:
          type: integer
          format: int32
        workedMinutes:
          type: integer
          format: int32
          description: End minus start minus break, in whole minutes. Not rounded.
        grossCents:
          type: integer
          format: int64
          description: Worked minutes times the shift's hourly rate, in euro cents, rounded half up.
        approvedAt:
          type: string
          format: date-time
          description: When the hours were last saved.

    HoursStatus:
      type: string
      description: "`OPEN` until the agency approved the hours, then `APPROVED`."
      enum: [OPEN, APPROVED]

    HoursShift:
      type: object
      description: The shift of an hours entry.
      required: [id, title, startsAt, endsAt, hourlyRateCents, client, location]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        hourlyRateCents:
          type: integer
          format: int32
        client:
          $ref: "#/components/schemas/ClientSummary"
        location:
          $ref: "#/components/schemas/Location"

    HoursEntry:
      type: object
      description: The hours of one worker on one shift.
      required: [assignmentId, status, shift, worker]
      properties:
        assignmentId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/HoursStatus"
        shift:
          $ref: "#/components/schemas/HoursShift"
        worker:
          $ref: "#/components/schemas/AssignedWorker"
        checkedInAt:
          type: string
          format: date-time
        checkedOutAt:
          type: string
          format: date-time
        hours:
          description: Present when the status is `APPROVED`.
          $ref: "#/components/schemas/WorkedHours"

    HoursEntryPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/HoursEntry"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    AgencySettings:
      type: object
      required: [autoConfirm, cancellationDeadlineHours]
      properties:
        autoConfirm:
          type: boolean
          description: Claims are confirmed right away instead of waiting for the agency. Off by default.
        cancellationDeadlineHours:
          type: integer
          format: int32
          minimum: 0
          maximum: 336
          description: |
            How many hours before the start a worker can still drop out in the
            app. 24 by default; 0 means until the start.
          examples: [24]
        waitlist:
          type: boolean
          description: |
            Workers can join the waitlist of a full shift and move up when a
            spot frees up (ADR 0029). Off by default. Always present in
            responses; absent in a request keeps the current value.

    ShiftContact:
      type: object
      description: The person at the agency to ask about a shift; the dispatcher who created it.
      required: [name]
      properties:
        name:
          type: string
          examples: [Anna Berger]
        phone:
          type: string
          description: Absent when the contact has no phone number on record.
          examples: ["+43 660 5550100"]

    WorkerShift:
      type: object
      description: A shift as a worker sees it.
      required:
        - id
        - title
        - status
        - client
        - location
        - startsAt
        - endsAt
        - endIsEstimate
        - hourlyRateCents
        - slots
        - takenSlots
        - qualifications
        - contact
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          description: What to bring, the meeting point and anything else workers need to know.
        status:
          description: Never `DRAFT`.
          $ref: "#/components/schemas/ShiftStatus"
        client:
          $ref: "#/components/schemas/ClientSummary"
        location:
          $ref: "#/components/schemas/Location"
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        endIsEstimate:
          type: boolean
          description: The end is approximate; clients show it with "ca.".
        hourlyRateCents:
          type: integer
          format: int32
          description: Gross pay per hour in euro cents.
        slots:
          type: integer
          format: int32
          description: How many workers the shift needs.
        takenSlots:
          type: integer
          format: int32
          description: How many of the slots are claimed. The shift is full when it equals `slots`.
        qualifications:
          type: array
          description: Qualifications the shift asks for. Information only; a claim is not checked against them.
          items:
            $ref: "#/components/schemas/Qualification"
        contact:
          $ref: "#/components/schemas/ShiftContact"
        assignment:
          description: |
            The worker's own claim on this shift. Absent when they have not
            claimed it, and while they are on the waitlist.
          $ref: "#/components/schemas/AssignmentSummary"
        waitlistEnabled:
          type: boolean
          description: |
            The agency uses the waitlist. Clients offer joining when this is
            true, the shift is full and published, it has not started, and the
            worker has neither an `assignment` nor a `waitlist` place. Absent
            means false.
        waitlist:
          description: The worker's place on the shift's waitlist. Absent when they are not waiting.
          $ref: "#/components/schemas/WaitlistPlace"

    WaitlistPlace:
      type: object
      description: Where a worker stands on the waitlist of a shift.
      required: [position, joinedAt]
      properties:
        position:
          type: integer
          format: int32
          minimum: 1
          description: The place in line; 1 moves up next.
        joinedAt:
          type: string
          format: date-time

    WaitlistEntry:
      type: object
      description: A worker waiting for a spot on a shift, as the agency sees them.
      required: [id, position, worker, joinedAt]
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
          format: int32
          minimum: 1
          description: The place in line; 1 moves up next.
        worker:
          $ref: "#/components/schemas/AssignedWorker"
        joinedAt:
          type: string
          format: date-time

    WaitlistEntryPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/WaitlistEntry"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    WorkerShiftPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/WorkerShift"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    UnreadCount:
      type: object
      required: [unreadCount]
      properties:
        unreadCount:
          type: integer
          format: int32
          minimum: 0

    ConversationEvent:
      type: object
      description: |
        The `data` of a `conversation` event on the event streams. Tells which
        conversation changed; the client reloads it.
      required: [conversationId, change]
      properties:
        conversationId:
          type: string
          format: uuid
        change:
          $ref: "#/components/schemas/ConversationChange"

    ConversationChange:
      type: string
      description: |
        `MESSAGE` when a message of any type was added, `READ` when messages
        in it were marked as read. Clients treat values they don't know like
        `MESSAGE` and reload.
      enum: [MESSAGE, READ]

    MessageType:
      type: string
      description: |
        `TEXT` from the worker or the agency, `SYSTEM` written by the platform
        when a claim or shift changed, `BROADCAST` sent by the agency to all
        confirmed workers of a shift.
      enum: [TEXT, SYSTEM, BROADCAST]

    SystemEvent:
      type: string
      description: |
        What a `SYSTEM` message reports, so that clients can word it in their
        language. `body` carries a German text as a fallback. `SHIFT_CHANGED`
        means the agency changed the shift, and its `body` says what changed.
        The `WAITLIST_*` events report the waitlist: moved up into a claim
        that waits for the agency (`WAITLIST_MOVED_UP`) or into a confirmed
        spot (`WAITLIST_MOVED_UP_CONFIRMED`), taken off by the agency
        (`WAITLIST_REMOVED_BY_AGENCY`), or taken off because the worker is
        booked at the same time by now (`WAITLIST_SKIPPED`).

        New values may be added. Clients show the `body` of an event they do
        not know.
      enum:
        - CLAIM_CONFIRMED
        - CLAIM_REJECTED
        - CLAIM_CANCELLED_BY_WORKER
        - REMOVED_BY_AGENCY
        - SHIFT_CANCELLED
        - SHIFT_CHANGED
        - WAITLIST_MOVED_UP
        - WAITLIST_MOVED_UP_CONFIRMED
        - WAITLIST_REMOVED_BY_AGENCY
        - WAITLIST_SKIPPED

    MessageShift:
      type: object
      description: The shift a message is about.
      required: [id, title, startsAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        startsAt:
          type: string
          format: date-time

    Message:
      type: object
      required: [id, type, body, fromWorker, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/MessageType"
        event:
          description: Present for `SYSTEM` messages; says what the message reports.
          $ref: "#/components/schemas/SystemEvent"
        body:
          type: string
        fromWorker:
          type: boolean
          description: Written by the worker; otherwise by the agency or the platform.
        senderName:
          type: string
          description: The dispatcher who wrote a `TEXT` or `BROADCAST` message. Absent for the worker's own and for `SYSTEM` messages.
          examples: [Anna Berger]
        shift:
          $ref: "#/components/schemas/MessageShift"
        createdAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
          description: When the other side read it. Absent while unread.

    MessagePage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    MessageRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
        shiftId:
          type: string
          format: uuid
          description: The shift the message is about.

    BroadcastRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
          examples: [Bitte Sicherheitsschuhe mitbringen, Treffpunkt ist heute Tor 5.]

    BroadcastResult:
      type: object
      required: [recipients]
      properties:
        recipients:
          type: integer
          format: int32
          description: How many confirmed workers got the message.

    ConversationWorker:
      type: object
      required: [id, firstName, lastName]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string

    Conversation:
      type: object
      required: [id, worker, lastMessage, unreadCount]
      properties:
        id:
          type: string
          format: uuid
        worker:
          $ref: "#/components/schemas/ConversationWorker"
        lastMessage:
          $ref: "#/components/schemas/Message"
        unreadCount:
          type: integer
          format: int32
          description: Messages of the worker nobody at the agency has read yet.

    ConversationPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    PushPlatform:
      type: string
      enum: [ANDROID, IOS]

    PushTokenRequest:
      type: object
      required: [token, platform]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 4096
          description: The Firebase Cloud Messaging registration token of the device.
        platform:
          $ref: "#/components/schemas/PushPlatform"

    NotificationSettings:
      type: object
      required: [newShiftsPaused]
      properties:
        newShiftsPaused:
          type: boolean
          description: No push for new shifts while true.

    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          description: Name of the request field.
          examples: [email]
        code:
          type: string
          description: Machine-readable reason.
          examples: [invalid_format]

    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: URI reference that identifies the problem type.
          default: about:blank
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          format: int32
          description: HTTP status code.
          minimum: 100
          maximum: 599
        detail:
          type: string
          description: Human-readable explanation of this occurrence.
        instance:
          type: string
          format: uri-reference
          description: URI reference that identifies this occurrence.
        code:
          type: string
          description: Machine-readable error code. Clients translate it into a localized message.
          examples: [email_already_registered]
        errors:
          type: array
          description: Field errors, present when `code` is `validation_failed`.
          items:
            $ref: "#/components/schemas/FieldError"
