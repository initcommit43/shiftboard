name: backend

on:
  # No path filter here: the job below is a required check, and a check that
  # never starts would block the pull request. The changes job decides instead.
  pull_request:
  push:
    branches: [main]
    paths:
      - backend/**
      - api/openapi.yaml
      - .github/workflows/backend.yml

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            relevant:
              - 'backend/**'
              - 'api/openapi.yaml'
              - '.github/workflows/backend.yml'

  build:
    name: Build, tests and module boundaries
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      # Runs unit tests, the Spring Modulith boundary test and the
      # Testcontainers integration tests.
      - run: ./gradlew build
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: backend-test-reports
          path: backend/build/reports/tests
          retention-days: 7
