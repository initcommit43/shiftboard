name: design-tokens

on:
  # No path filter here: the job below is a required check, and a check that
  # never starts would block the pull request. The changes job decides instead.
  pull_request:
  push:
    branches: [main]
    paths:
      - design-tokens/**
      - dashboard/src/styles/tokens.css
      - mobile/lib/core/theme/tokens.dart
      - .github/workflows/design-tokens.yml

concurrency:
  group: design-tokens-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes (design-tokens)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            relevant:
              - 'design-tokens/**'
              - 'dashboard/src/styles/tokens.css'
              - 'mobile/lib/core/theme/tokens.dart'
              - '.github/workflows/design-tokens.yml'

  check:
    name: Check generated token outputs
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: design-tokens
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: design-tokens/package-lock.json
      - run: npm ci
      - run: npm run check
