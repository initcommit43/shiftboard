name: api

on:
  # No path filter here: the job below is a required check, and a check that
  # never starts would block the pull request. The changes job decides instead.
  pull_request:
  push:
    branches: [main]
    paths:
      - api/**
      - mobile/packages/shiftboard_api/**
      - dashboard/src/api/generated/**
      - .github/workflows/api.yml

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes (api)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            relevant:
              - 'api/**'
              - 'mobile/packages/shiftboard_api/**'
              - 'dashboard/src/api/generated/**'
              - '.github/workflows/api.yml'

  check:
    name: Lint spec and check generated clients
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      # openapi-generator runs on Java; the Dart client needs build_runner.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - run: npm ci
      - run: npm run lint
      - run: npm run check
