name: api

on:
  pull_request:
    paths:
      - api/**
      - mobile/packages/shiftboard_api/**
      - dashboard/src/api/generated/**
      - .github/workflows/api.yml
  push:
    branches: [main]
    paths:
      - api/**
      - mobile/packages/shiftboard_api/**
      - dashboard/src/api/generated/**
      - .github/workflows/api.yml

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint spec and check generated clients
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      # openapi-generator runs on Java; the Dart client needs build_runner.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - run: npm ci
      - run: npm run lint
      - run: npm run check
