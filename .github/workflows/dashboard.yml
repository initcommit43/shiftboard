name: dashboard

on:
  pull_request:
    paths:
      - dashboard/**
      - .github/workflows/dashboard.yml
  push:
    branches: [main]
    paths:
      - dashboard/**
      - .github/workflows/dashboard.yml

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, type check, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
